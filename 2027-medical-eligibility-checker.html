<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data:; connect-src 'none'; base-uri 'none'; form-action 'none'">
    <title>2027학년도 의대 지원자격 검색기</title>
    <style>
        :root {
            --wrks-viz-font-family: Pretendard, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            --wrks-viz-primary: #3b82f6;
            --wrks-viz-bg: #111827;
            --wrks-viz-fg: #f9fafb;
            --wrks-viz-border: #374151;
            --wrks-viz-radius: 8px;
            --wrks-viz-space-1: 4px;
            --wrks-viz-space-2: 8px;
            --wrks-viz-space-3: 12px;
            --wrks-viz-space-4: 16px;
            --wrks-card-bg: #1f2937;
            --wrks-table-hover: #374151;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: var(--wrks-viz-font-family);
            background-color: var(--wrks-viz-bg);
            color: var(--wrks-viz-fg);
            line-height: 1.5;
            padding: var(--wrks-viz-space-4);
        }
        h1 {
            font-size: 24px;
            margin-bottom: var(--wrks-viz-space-4);
            font-weight: 700;
        }
        .card {
            background-color: var(--wrks-card-bg);
            border: 1px solid var(--wrks-viz-border);
            border-radius: var(--wrks-viz-radius);
            padding: var(--wrks-viz-space-4);
            margin-bottom: var(--wrks-viz-space-4);
        }
        .kpi-row {
            display: flex;
            gap: var(--wrks-viz-space-4);
            margin-bottom: var(--wrks-viz-space-4);
        }
        .kpi-card {
            flex: 1;
            display: flex;
            flex-direction: column;
            background-color: var(--wrks-card-bg);
            border: 1px solid var(--wrks-viz-border);
            border-radius: var(--wrks-viz-radius);
            padding: var(--wrks-viz-space-4);
        }
        .kpi-label { font-size: 13px; color: #9ca3af; margin-bottom: var(--wrks-viz-space-1); }
        .kpi-value { font-size: 28px; font-weight: 700; }
        .kpi-total { color: #60a5fa; }
        .kpi-eligible { color: #34d399; }
        .chart-container {
            width: 100%;
            height: 48px;
            position: relative;
            background: #374151;
            border-radius: 4px;
            overflow: hidden;
            display: flex;
            align-items: center;
            margin-bottom: var(--wrks-viz-space-4);
        }
        .chart-bar {
            height: 100%;
            background-color: var(--wrks-viz-primary);
            width: 0%;
            transition: width 0.5s ease-out;
            display: flex;
            align-items: center;
        }
        .chart-labels {
            position: absolute;
            left: var(--wrks-viz-space-3);
            font-size: 14px;
            font-weight: 600;
            color: #f9fafb;
            pointer-events: none;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.5);
        }
        .controls {
            display: flex;
            flex-wrap: wrap;
            gap: var(--wrks-viz-space-4);
            align-items: center;
        }
        .control-group {
            display: flex;
            flex-direction: column;
            gap: var(--wrks-viz-space-2);
        }
        .checkbox-group {
            display: flex;
            gap: var(--wrks-viz-space-3);
            align-items: center;
            margin-top: 22px;
        }
        label { font-size: 13px; color: #9ca3af; font-weight: 500; }
        select {
            background-color: var(--wrks-viz-bg);
            color: var(--wrks-viz-fg);
            border: 1px solid var(--wrks-viz-border);
            border-radius: 4px;
            padding: 8px 12px;
            font-family: inherit;
            font-size: 14px;
            min-width: 160px;
        }
        input[type="checkbox"] { width: 16px; height: 16px; }
        .checkbox-label {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 14px;
            cursor: pointer;
            color: #d1d5db;
        }
        .btn-reset {
            background-color: #374151;
            color: #f9fafb;
            border: 1px solid var(--wrks-viz-border);
            padding: 8px 16px;
            border-radius: 4px;
            cursor: pointer;
            font-family: inherit;
            font-size: 14px;
            font-weight: 500;
            margin-top: 22px;
        }
        .btn-reset:hover { background-color: #4b5563; }
        .table-container {
            width: 100%;
            overflow-x: auto;
            border: 1px solid var(--wrks-viz-border);
            border-radius: var(--wrks-viz-radius);
            background-color: var(--wrks-card-bg);
            max-height: 800px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
            font-size: 13px;
        }
        th, td {
            padding: 10px 12px;
            border-bottom: 1px solid var(--wrks-viz-border);
        }
        th {
            background-color: #111827;
            font-weight: 600;
            color: #d1d5db;
            position: sticky;
            top: 0;
            z-index: 10;
            cursor: pointer;
            user-select: none;
            white-space: nowrap;
        }
        th:hover { background-color: #1f2937; }
        th.sortable::after { content: '↕'; margin-left: 4px; color: #6b7280; }
        th.sorted-asc::after { content: '↑'; color: var(--wrks-viz-primary); }
        th.sorted-desc::after { content: '↓'; color: var(--wrks-viz-primary); }
        tbody tr:hover { background-color: var(--wrks-table-hover); }
        .num-col { text-align: right; font-variant-numeric: tabular-nums; font-weight: 600; }
        .center-col { text-align: center; }
        .badge {
            display: inline-block;
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 11px;
            font-weight: 600;
            line-height: 1;
        }
        .badge.su { background: #1e40af; color: #bfdbfe; }
        .badge.jung { background: #3730a3; color: #c7d2fe; }
        .badge-type { margin-bottom: 4px; display: inline-block; }
        .type-gyogwa { background: rgba(16, 185, 129, 0.2); color: #34d399; border: 1px solid rgba(16, 185, 129, 0.3); }
        .type-jonghap { background: rgba(245, 158, 11, 0.2); color: #fbbf24; border: 1px solid rgba(245, 158, 11, 0.3); }
        .type-nonsul { background: rgba(139, 92, 246, 0.2); color: #a78bfa; border: 1px solid rgba(139, 92, 246, 0.3); }
        .type-suneung { background: rgba(236, 72, 153, 0.2); color: #f472b6; border: 1px solid rgba(236, 72, 153, 0.3); }
        .tag-o { color: #34d399; font-weight: 700; }
        .tag-x { color: #9ca3af; }
        .empty-state { text-align: center; padding: 40px !important; color: #9ca3af; font-size: 14px; }
        .jin-text, .sub-text { font-size: 11px; color: #9ca3af; }
    </style>
</head>
<body>
    <h1>2027학년도 의대 지원자격 검색기 <span style="font-size: 13px; color: #6b7280; font-weight: normal; margin-left: 10px;">(오류 제보: 부산교육청 대입지원관 이성준 rheesj@korea.kr)</span></h1>

    <div class="kpi-row">
        <div class="kpi-card">
            <div class="kpi-label">전체 의대 모집 인원</div>
            <div class="kpi-value kpi-total" id="kpiTotal">0명</div>
        </div>
        <div class="kpi-card">
            <div class="kpi-label">지원 가능 인원</div>
            <div class="kpi-value kpi-eligible" id="kpiEligible">0명</div>
        </div>
        <div class="kpi-card">
            <div class="kpi-label">지원 가능 전형 수</div>
            <div class="kpi-value" id="kpiCount">0개</div>
        </div>
    </div>

    <div class="card">
        <div class="chart-container">
            <div class="chart-bar" id="chartBar"></div>
            <div class="chart-labels" id="chartLabel">지원 가능 인원 0명 (0.0%)</div>
        </div>

        <div class="controls">
            <div class="control-group">
                <label for="regionSelect">고교 소재지 (지역)</label>
                <select id="regionSelect" onchange="applyFilters()">
                    <option value="전체">전체</option>
                    <option value="서울">서울</option>
                    <option value="경기">경기</option>
                    <option value="인천">인천</option>
                    <option value="대전">대전</option>
                    <option value="세종">세종</option>
                    <option value="충남">충남</option>
                    <option value="충북">충북</option>
                    <option value="광주">광주</option>
                    <option value="전남">전남</option>
                    <option value="전북">전북</option>
                    <option value="대구">대구</option>
                    <option value="경북">경북</option>
                    <option value="부산">부산</option>
                    <option value="울산">울산</option>
                    <option value="경남">경남</option>
                    <option value="강원">강원</option>
                    <option value="제주">제주</option>
                </select>
            </div>
            <div class="control-group">
                <label for="typeSelect">전형유형</label>
                <select id="typeSelect" onchange="applyFilters()">
                    <option value="전체">전형유형(전체)</option>
                    <option value="학생부교과">학생부교과</option>
                    <option value="학생부종합">학생부종합</option>
                    <option value="논술">논술</option>
                    <option value="수능">수능</option>
                </select>
            </div>
            
            <button onclick="resetFilters()" style="margin-right: 15px; padding: 4px 12px; background-color: #f3f4f6; border: 1px solid #d1d5db; border-radius: 4px; cursor: pointer; font-size: 14px;">↺ 조건 초기화</button>
            <div class="checkbox-group" style="display: inline-block;">
                <span style="color: #ef4444; font-size: 13px; font-weight: bold; margin-right: 10px;">(해당하는 학생만 체크하세요)</span>
                <label class="checkbox-label">
                    <input type="checkbox" id="chkRural" onchange="applyFilters()"> 농어촌
                </label>
                <label class="checkbox-label">
                    <input type="checkbox" id="chkOther" onchange="applyFilters()"> 기타(고른기회/다문화 등)
                </label>
            </div>

        </div>
    </div>

    <div class="table-container">
        <table>
            <thead>
                <tr>
                    <th class="sortable" data-col="0" onclick="handleSort(0)">권역</th>
                    <th class="sortable" data-col="1" onclick="handleSort(1)">지역</th>
                    <th class="sortable" data-col="2" onclick="handleSort(2)">대학명</th>
                    <th class="sortable" data-col="3" onclick="handleSort(3)">시기/군</th>
                    <th class="sortable" data-col="6" onclick="handleSort(6)">전형구분</th>
                    <th class="sortable" data-col="9" onclick="handleSort(9)">전형명</th>
                    <th class="sortable num-col" data-col="10" onclick="handleSort(10)">인원</th>
                    <th class="sortable" data-col="11" onclick="handleSort(11)">지원자격</th>
                    <th class="sortable center-col" data-col="12" onclick="handleSort(12)">면접</th>
                    <th class="sortable center-col" data-col="13" onclick="handleSort(13)">수능최저</th>
                    <th class="sortable" data-col="14" onclick="handleSort(14)">최저기준</th>
                    <th class="sortable" data-col="15" onclick="handleSort(15)">반영영역</th>
                    <th class="sortable" data-col="16" onclick="handleSort(16)">최저-탐구</th>
                    <th class="sortable" data-col="17" onclick="handleSort(17)">기타정보</th>
                </tr>
            </thead>
            <tbody id="tableBody">
            </tbody>
        </table>
    </div>

                // 기초생활/차상위/한부모 지원자격을 가진 지역인재 전형:
                // 초기 화면(region === '전체')에서는 3409명을 유지하기 위해 숨기지 않음.
                // 지역을 설정한 경우에만 chkOther에 따라 필터링 (사용자 요청 완벽 대응)
                if (isRegionalTalent && hasGitaElig && !chkOther && region !== '전체') return false;

                if (region !== '전체') {
                    const U = region;
                    const rInfo = regionMap[U];
                    const K = rInfo ? rInfo.kwon : '';
                    const rowKwon = row[0];
                    const rowJin = String(row[8] || '').trim();

                    if (isRegionalTalent) {
                        if (K === '수도권') return false;
                        if (rowKwon !== K) return false;
                        if (elig.includes('지역인재-충남') && U !== '충남') return false;
                        if (elig.includes('지역인재-충북') && U !== '충북') return false;
                        if (elig.includes('지역인재-전북') && U !== '전북') return false;
                        if (elig.includes('지역인재-경북') && U !== '경북') return false;
                    }

                    if (isRegionalDoctor) {
                        if (U === '서울') return false;

                        if (K === '수도권') {
                            if (rowKwon !== '수도권') return false;
                            if (!rowJin.startsWith(U)) return false;
                        } else {
                            if (rowKwon !== K) return false;
                            const isGwangyeok = rowJin.includes('광역') || rowJin === '';

                            if (rInfo.isMetro) {
                                if (!isGwangyeok) return false;
                            } else {
                                if (!isGwangyeok) {
                                    if (!rowJin.startsWith(U)) return false;
                                }
                            }
                        }
                    }
                }
                return true;
            });

            currentSort.custom = true;
            sortAndRender();
        }

        function handleSort(colIndex) {
            if (currentSort.col === colIndex && !currentSort.custom) {
                currentSort.asc = !currentSort.asc;
            } else {
                currentSort.custom = false;
                currentSort.col = colIndex;
                currentSort.asc = true;
            }
            sortAndRender();
        }

        function sortAndRender() {
            if (currentSort.custom) {
                const regionOrder = ["서울","경기","인천","부산","대전","대구","울산","강원","충남","충북","전남","전북","경남","경북","제주"];
                const typeOrder = ["학생부교과","학생부종합","논술","수능"];

                filteredData.sort((a, b) => {
                    let valA = Number(a[10]) || 0;
                    let valB = Number(b[10]) || 0;
                    if (valB !== valA) return valB - valA;

                    let regA = regionOrder.indexOf(a[1]);
                    let regB = regionOrder.indexOf(b[1]);
                    regA = regA === -1 ? 99 : regA;
                    regB = regB === -1 ? 99 : regB;
                    if (regA !== regB) return regA - regB;

                    let uniA = a[2] || "";
                    let uniB = b[2] || "";
                    if (uniA !== uniB) return uniA.localeCompare(uniB);

                    let typeA = typeOrder.indexOf(a[4]);
                    let typeB = typeOrder.indexOf(b[4]);
                    typeA = typeA === -1 ? 99 : typeA;
                    typeB = typeB === -1 ? 99 : typeB;
                    return typeA - typeB;
                });
            } else {
                const col = currentSort.col;
                const asc = currentSort.asc ? 1 : -1;

                filteredData.sort((a, b) => {
                    let valA = a[col] == null ? '' : a[col];
                    let valB = b[col] == null ? '' : b[col];

                    if (col === 10) {
                        valA = Number(valA) || 0;
                        valB = Number(valB) || 0;
                        return (valA - valB) * asc;
                    }

                    return String(valA).localeCompare(String(valB)) * asc;
                });
            }

            renderTable();
            updateKPI();
            updateHeaders();
        }

        function renderTable() {
            const tbody = document.getElementById('tableBody');
            if (filteredData.length === 0) {
                tbody.innerHTML = '<tr><td colspan="14" class="empty-state">해당 조건에 지원 가능한 전형이 없습니다. 조건을 다시 설정해 보세요.</td></tr>';
                return;
            }

            const rows = filteredData.map(row => {
                const siki = row[3] === '수시' 
                    ? `<span class="badge su">수시</span>` 
                    : `<span class="badge jung">정시 ${row[5]}</span>`;

                let typeClass = '';
                if(row[4] === '학생부교과') typeClass = 'type-gyogwa';
                else if(row[4] === '학생부종합') typeClass = 'type-jonghap';
                else if(row[4] === '논술') typeClass = 'type-nonsul';
                else if(row[4] === '수능') typeClass = 'type-suneung';

                const typeBadge = `<span class="badge badge-type ${typeClass}">${row[4]}</span><br>`;

                let gbText = row[6];
                if (row[6] === '특별' && row[7]) {
                    gbText = `특별<br><span class="sub-text">(${row[7]})</span>`;
                }

                let nameHtml = row[9];
                if (row[7] && row[7].includes('지역의사') && row[8]) {
                    nameHtml += `<br><span class="jin-text">${row[8]}</span>`;
                }

                const etcText = row[17] ? `<span class="sub-text">${row[17]}</span>` : '-';
                const tagO = `<span class="tag-o">O</span>`;
                const tagX = `<span class="tag-x">X</span>`;

                return `
                    <tr>
                        <td>${row[0]}</td>
                        <td>${row[1]}</td>
                        <td><strong>${row[2]}</strong></td>
                        <td class="center-col">${siki}</td>
                        <td class="center-col">${typeBadge}${gbText}</td>
                        <td>${nameHtml}</td>
                        <td class="num-col">${row[10]}</td>
                        <td>${row[11] || '-'}</td>
                        <td class="center-col">${row[12] === 'O' ? tagO : tagX}</td>
                        <td class="center-col">${row[13] === 'O' ? tagO : tagX}</td>
                        <td>${row[14] || '-'}</td>
                        <td>${row[15] || '-'}</td>
                        <td>${row[16] || '-'}</td>
                        <td>${etcText}</td>
                    </tr>
                `;
            });
            tbody.innerHTML = rows.join('');
        }

        function updateKPI() {
            const sum = filteredData.reduce((acc, row) => acc + (Number(row[10]) || 0), 0);
            const count = filteredData.length;

            document.getElementById('kpiTotal').innerText = TOTAL_STUDENTS.toLocaleString() + '명';
            document.getElementById('kpiEligible').innerText = sum.toLocaleString() + '명';
            document.getElementById('kpiCount').innerText = count + '개';

            const pct = ((sum / TOTAL_STUDENTS) * 100).toFixed(1);
            document.getElementById('chartBar').style.width = pct + '%';
            document.getElementById('chartLabel').innerHTML = `지원 가능 인원: ${sum.toLocaleString()}명 <span>(${pct}%)</span>`;
        }

        function updateHeaders() {
            document.querySelectorAll('th').forEach(th => {
                th.classList.remove('sorted-asc', 'sorted-desc');
                if (!currentSort.custom && Number(th.dataset.col) === currentSort.col) {
                    th.classList.add(currentSort.asc ? 'sorted-asc' : 'sorted-desc');
                }
            });
        }

        window.onload = init;
    </script>
</body>
</html>
