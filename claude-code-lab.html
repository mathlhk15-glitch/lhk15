<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Claude Code 학습 노트 · Cowork부터 개발 도구 확장까지</title>
<meta name="description" content="내가 직접 따라 하며 익히는 Claude 학습 노트. Cowork, Skill, Claude Code, 검수, Git, GitHub Pages 배포, 개발 도구 확장과 내 프로젝트 회고까지 단계별로 정리했습니다.">
<meta property="og:title" content="Claude Code 학습 노트">
<meta property="og:description" content="Cowork로 업무를 정리하고 Claude Code로 내 도구를 만든 뒤 Skill·검수·배포·확장까지 익히는 개인 학습 노트">
<meta property="og:type" content="website">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#F3F6FA; --surface:#FFFFFF; --ink:#14213D; --muted:#56627A;
  --line:#D5DDE9; --blue:#2457C5; --blue-soft:#DCE6F7; --blue-ink:#163A86;
  --amber:#9A6B00; --amber-soft:#FFF3D1; --green:#1F7A4A; --green-soft:#DDF2E6;
  --term:#16223B; --term-ink:#E3EAF7; --term-dim:#8FA2C4;
  --sans:"IBM Plex Sans KR",-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --paper:#0E1524; --surface:#16203A; --ink:#E6ECF6; --muted:#9BA9C3;
    --line:#2A3858; --blue:#7FA6F0; --blue-soft:#1E2F55; --blue-ink:#B9CDF6;
    --amber:#F0C35A; --amber-soft:#3A2F12; --green:#6FD3A0; --green-soft:#153828;
    --term:#0A101D; --term-ink:#E3EAF7; --term-dim:#7F92B5;
  }
}
:root[data-theme="dark"]{
  --paper:#0E1524; --surface:#16203A; --ink:#E6ECF6; --muted:#9BA9C3;
  --line:#2A3858; --blue:#7FA6F0; --blue-soft:#1E2F55; --blue-ink:#B9CDF6;
  --amber:#F0C35A; --amber-soft:#3A2F12; --green:#6FD3A0; --green-soft:#153828;
  --term:#0A101D; --term-ink:#E3EAF7; --term-dim:#7F92B5;
}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:17px;line-height:1.75;-webkit-text-size-adjust:100%}
button{font-family:inherit;font-size:inherit;color:inherit}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px;border-radius:4px}

/* layout */
.app{display:grid;grid-template-columns:300px 1fr;min-height:100vh}
.rail{position:sticky;top:0;height:100vh;overflow-y:auto;border-right:1px solid var(--line);background:var(--surface);padding:24px 20px 40px}
.main{min-width:0;padding:32px clamp(18px,5vw,64px) 80px}
.page{max-width:720px}

/* rail */
.brand{font-weight:700;font-size:18px;line-height:1.35;margin:0 0 4px}
.brand-sub{color:var(--muted);font-size:13px;margin:0 0 18px}
.meter{height:6px;background:var(--blue-soft);border-radius:3px;overflow:hidden}
.meter i{display:block;height:100%;background:var(--blue);width:0;transition:width .4s}
.meter-label{font-size:13px;color:var(--muted);margin:6px 0 22px}
.route{list-style:none;margin:0;padding:0}
.session{margin:0 0 18px}
.session-name{font-size:13px;font-weight:700;color:var(--blue-ink);margin:0 0 6px;padding-left:2px}
.stops{list-style:none;margin:0;padding:0;position:relative}
.stops::before{content:"";position:absolute;left:9px;top:10px;bottom:10px;width:2px;background:var(--line)}
.stop button{display:flex;align-items:flex-start;gap:10px;width:100%;text-align:left;background:none;border:0;padding:5px 6px 5px 0;cursor:pointer;border-radius:6px;font-size:14.5px;line-height:1.45;color:var(--ink)}
.stop button:hover{background:var(--blue-soft)}
.dot{flex:none;width:20px;height:20px;border-radius:50%;border:2px solid var(--line);background:var(--surface);position:relative;z-index:1;margin-top:1px;display:grid;place-items:center;font-size:11px;color:#fff}
.stop.done .dot{background:var(--blue);border-color:var(--blue)}
.stop.done .dot::after{content:"✓";font-weight:700}
.stop.current button{font-weight:700}
.stop.current .dot{border-color:var(--blue);box-shadow:0 0 0 4px var(--blue-soft)}
.rail-tools{display:flex;gap:8px;margin-top:22px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:13px;cursor:pointer}
.chip:hover{border-color:var(--blue)}

/* mobile top */
.topbar{display:none}
@media (max-width:900px){
  .app{grid-template-columns:1fr}
  .rail{position:fixed;inset:0 auto 0 0;width:min(86vw,340px);height:100%;z-index:30;transform:translateX(-105%);transition:transform .25s;padding-top:calc(24px + env(safe-area-inset-top,0px));box-shadow:0 0 40px rgba(0,0,0,.25)}
  .rail.open{transform:none}
  .scrim{position:fixed;inset:0;background:rgba(10,16,30,.45);z-index:20;display:none}
  .scrim.show{display:block}
  .topbar{display:flex;align-items:center;gap:10px;position:sticky;top:env(safe-area-inset-top,0px);z-index:10;background:var(--surface);border-bottom:1px solid var(--line);padding:10px 16px}
  .topbar .t{flex:1;min-width:0;font-size:14px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .topbar .meter{width:64px}
  .main{padding:22px 18px 80px}
  body{font-size:16.5px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

/* lesson */
.crumb{font-size:14px;color:var(--blue-ink);font-weight:500;margin:0 0 6px}
h1{font-size:clamp(26px,5.2vw,36px);line-height:1.3;margin:0 0 14px;letter-spacing:-.01em}
h2{font-size:20px;line-height:1.4;margin:36px 0 10px}
h3{font-size:17px;margin:24px 0 6px}
p{margin:0 0 14px}
.goal{border-left:4px solid var(--blue);padding:4px 0 4px 16px;margin:0 0 26px;color:var(--ink)}
.goal b{display:block;font-size:13px;color:var(--blue-ink)}
ul.plain{margin:0 0 16px;padding-left:1.2em}
ul.plain li{margin:2px 0}

/* prompt block */
.prompt{background:var(--blue-soft);border:1px solid var(--line);border-left:4px solid var(--blue);color:var(--ink);border-radius:14px 14px 14px 4px;padding:14px 16px 12px;margin:0 0 18px;position:relative}
.prompt .who{font-size:12.5px;font-weight:700;color:var(--blue);margin-bottom:4px}
.prompt .txt{white-space:pre-wrap;margin:0}

/* terminal/code */
.code{background:var(--term);color:var(--term-ink);border-radius:10px;margin:0 0 18px;overflow:hidden}
.code-head{display:flex;justify-content:space-between;align-items:center;padding:7px 12px;border-bottom:1px solid rgba(255,255,255,.08);font-family:var(--mono);font-size:12.5px;color:var(--term-dim)}
.code pre{margin:0;padding:14px 16px;overflow-x:auto;font-family:var(--mono);font-size:13.5px;line-height:1.6;white-space:pre}
.copy{background:none;border:1px solid rgba(255,255,255,.18);color:var(--term-ink);border-radius:6px;padding:2px 10px;font-size:12px;cursor:pointer}
.prompt .copy{position:absolute;top:10px;right:10px;border-color:var(--line);color:var(--blue-ink);background:var(--surface)}
.copy.ok{border-color:var(--green);color:var(--green)}

/* flow */
.flow{list-style:none;margin:0 0 20px;padding:0;counter-reset:f}
.flow li{position:relative;padding:4px 0 4px 34px}
.flow li::before{counter-increment:f;content:counter(f);position:absolute;left:0;top:6px;width:22px;height:22px;border-radius:50%;background:var(--surface);border:2px solid var(--blue);color:var(--blue-ink);font-size:11.5px;font-weight:700;display:grid;place-items:center}
.flow li:not(:last-child)::after{content:"";position:absolute;left:10px;top:30px;bottom:-6px;width:2px;background:var(--blue-soft)}

/* callouts */
.call{border-radius:10px;padding:12px 16px;margin:0 0 18px;font-size:15.5px}
.call b.h{display:block;margin-bottom:2px}
.call.warn{background:var(--amber-soft);color:var(--ink)}
.call.warn b.h{color:var(--amber)}
.call.tip{background:var(--green-soft)}
.call.tip b.h{color:var(--green)}
.call.me{background:var(--surface);border:1px dashed var(--blue)}
.call.me b.h{color:var(--blue-ink)}

/* table */
.tbl{overflow-x:auto;margin:0 0 18px}
table{border-collapse:collapse;width:100%;font-size:15px;min-width:460px}
th,td{text-align:left;padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:13px;color:var(--muted);font-weight:700}
td:first-child{font-weight:700;white-space:nowrap}

/* checks */
.checks{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px 18px;margin:34px 0 20px}
.checks h2{margin:0 0 8px;font-size:17px}
.checks label{display:flex;gap:10px;align-items:flex-start;padding:6px 0;cursor:pointer}
.checks input{width:20px;height:20px;margin-top:4px;accent-color:var(--blue);flex:none}
.done-btn{margin-top:10px;width:100%;border:0;border-radius:10px;padding:12px;font-weight:700;background:var(--blue);color:#fff;cursor:pointer}
.done-btn[disabled]{background:var(--line);color:var(--muted);cursor:not-allowed}
.done-btn.is-done{background:var(--green-soft);color:var(--green)}

.pager{display:flex;gap:10px;margin-top:10px}
.pager button{flex:1;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:12px;cursor:pointer;text-align:left;font-size:14px;line-height:1.4}
.pager button:hover{border-color:var(--blue)}
.pager button[disabled]{visibility:hidden}
.pager small{display:block;color:var(--muted);font-size:12px}
.pager .nx{text-align:right}

/* home */
.hero-title{font-size:clamp(30px,6.4vw,46px);line-height:1.2;margin:4px 0 16px;letter-spacing:-.02em}
.hero-lead{font-size:18px;color:var(--muted);margin:0 0 26px;max-width:36em}
.sessions{display:grid;gap:12px;margin:10px 0 26px}
.sess-row{display:flex;gap:14px;align-items:center;padding:14px 16px;background:var(--surface);border:1px solid var(--line);border-radius:12px;cursor:pointer;text-align:left;width:100%}
.sess-row:hover{border-color:var(--blue)}
.sess-no{flex:none;width:44px;height:44px;border-radius:10px;background:var(--blue-soft);color:var(--blue-ink);font-weight:700;display:grid;place-items:center;font-size:15px}
.sess-row .nm{font-weight:700;display:block}
.sess-row .ds{color:var(--muted);font-size:14px;display:block}
.sess-row .pc{margin-left:auto;font-size:13px;color:var(--muted);white-space:nowrap}
.start{border:0;background:var(--blue);color:#fff;font-weight:700;border-radius:10px;padding:13px 20px;cursor:pointer}

/* quiz */
.q{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin:0 0 12px}
.q p{margin:0 0 10px;font-weight:500}
.q .ox{display:flex;gap:8px}
.q .ox button{flex:1;border:1px solid var(--line);background:var(--paper);border-radius:8px;padding:8px;cursor:pointer;font-weight:700}
.q .ans{display:none;margin-top:10px;font-size:15px}
.q.answered .ans{display:block}
.q .right{color:var(--green)} .q .wrong{color:var(--amber)}
.q.answered{box-shadow:0 4px 18px rgba(36,87,197,.08)}
.q.is-correct{border-color:var(--green);box-shadow:0 4px 18px rgba(31,122,74,.12)}
.q.is-wrong{border-color:var(--amber);box-shadow:0 4px 18px rgba(154,107,0,.12)}
.q.answered .ans{animation:reveal .22s ease-out}
@keyframes reveal{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}

/* curriculum accents */
.session:nth-child(1) .session-name{color:#A34A16}
.session:nth-child(2) .session-name{color:#2457C5}
.session:nth-child(3) .session-name{color:#7B4BA8}
.session:nth-child(4) .session-name{color:#1F7A4A}
.session:nth-child(5) .session-name{color:#8A5D00}
.session:nth-child(6) .session-name{color:#A03E58}
.session:nth-child(7) .session-name{color:#395B9A}
.session:nth-child(8) .session-name{color:#5C677D}
.session:nth-child(9) .session-name{color:#2F6B62}
:root[data-theme="dark"] .session-name{color:var(--blue-ink)!important}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .session-name{color:var(--blue-ink)!important}}

/* richer learning UI */
.path-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:18px 0 28px}
.path-card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px}
.path-card b{display:block;margin-bottom:4px;color:var(--blue-ink)}
.path-card span{font-size:14px;color:var(--muted)}
.badge{display:inline-block;font-size:12px;font-weight:700;padding:3px 8px;border-radius:999px;background:var(--blue-soft);color:var(--blue-ink);margin-right:5px}
.resource{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:12px 14px;margin:0 0 12px}
.resource a{color:var(--blue-ink);font-weight:700;text-underline-offset:2px}
.resource small{display:block;color:var(--muted);margin-top:2px}

.case-card{border:1px solid var(--line);background:var(--surface);border-radius:16px;padding:18px;margin:0 0 22px}
.case-card h3{margin:0 0 8px;font-size:20px}
.case-situation{margin:0 0 18px;color:var(--ink)}
.case-timeline{position:relative;margin:10px 0 18px;padding-left:24px}
.case-timeline:before{content:"";position:absolute;left:8px;top:4px;bottom:4px;width:2px;background:var(--line)}
.case-step{position:relative;border:1px solid var(--line);background:var(--paper);border-radius:12px;padding:14px 14px 12px;margin:0 0 14px;break-inside:avoid}
.case-step:before{content:"";position:absolute;left:-21px;top:18px;width:10px;height:10px;border-radius:50%;background:var(--blue);box-shadow:0 0 0 3px var(--surface)}
.case-ver{display:inline-block;font-size:12px;font-weight:800;color:var(--blue-ink);background:var(--blue-soft);border:1px solid var(--line);border-radius:999px;padding:3px 8px;margin-bottom:8px}
.case-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.case-cell{border-radius:10px;padding:10px 11px;min-width:0}
.case-cell b{display:block;font-size:12px;margin-bottom:4px}
.case-did{background:var(--blue-soft)}
.case-problem{background:var(--amber-soft)}
.case-fix{background:var(--green-soft)}
.case-result{border-top:1px dashed var(--line);padding-top:12px;margin-top:4px}
.case-lessons{margin:10px 0 0;padding-left:20px}
.case-links{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.case-links button,.jump-btn{border:1px solid var(--line);background:var(--surface);color:var(--blue-ink);border-radius:999px;padding:7px 11px;font:inherit;font-size:13px;font-weight:700;cursor:pointer}
.case-links button:hover,.jump-btn:hover{border-color:var(--blue)}
@media(max-width:700px){.case-grid{grid-template-columns:1fr}.case-card{padding:14px}.case-timeline{padding-left:20px}.case-step:before{left:-17px}}
.note-box{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:14px 16px;margin:0 0 18px}
.note-box label{display:block;font-weight:700;margin-bottom:8px}
.note-box textarea{width:100%;min-height:110px;resize:vertical;border:1px solid var(--line);background:var(--paper);color:var(--ink);border-radius:8px;padding:10px 12px;font:inherit;line-height:1.55}
.note-box small{display:block;color:var(--muted);margin-top:6px}
.toast{position:fixed;right:20px;bottom:20px;z-index:100;background:var(--term);color:var(--term-ink);padding:10px 14px;border-radius:9px;box-shadow:0 10px 30px rgba(0,0,0,.25);opacity:0;transform:translateY(8px);pointer-events:none;transition:.2s}
.toast.show{opacity:1;transform:none}

html.large-text body{font-size:19px}
html.large-text table{font-size:16px}
html.large-text .stop button{font-size:15.5px}

@media(max-width:700px){.path-grid{grid-template-columns:1fr}.resource{display:block}}

.print-only{display:none}
@media print{
  .rail,.topbar,.scrim,.pager,.done-btn,.copy,.rail-tools,.jump-btn,.case-links{display:none!important}
  .app{display:block}.main{padding:0}.page{max-width:none}
  body{background:#fff;color:#000;font-size:11pt;line-height:1.55}
  .code pre{white-space:pre-wrap;word-break:break-word}
  .prompt,.call,.checks,.note-box,.resource,.case-card,.case-step{break-inside:avoid}
  .q{display:none!important}.print-only{display:block!important}.qp{break-inside:avoid;margin:0 0 10px}.qp-box{margin:2px 0}.qp-ans{font-size:9.5pt;color:#333}
  .print-lesson{break-before:page}.print-lesson:first-of-type{break-before:auto}
  a{color:#000;text-decoration:none}
  .resource a::after{content:" (" attr(href) ")";font-weight:400;font-size:9pt;word-break:break-all}
}
</style>
</head>
<body>
<div class="topbar">
  <button class="chip" id="menuBtn" aria-label="목차 열기">목차</button>
  <span class="t" id="topTitle">Claude Code 학습 노트</span>
  <div class="meter"><i id="meterTop"></i></div>
</div>
<div class="scrim" id="scrim"></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<div class="app">
  <nav class="rail" id="rail" aria-label="실습 목차">
    <p class="brand">Claude Code<br>개인 학습 노트</p>
    <p class="brand-sub">Cowork → Skill → Claude Code → 검수·배포 → 확장 · 2026.10 기준</p>
    <div class="meter"><i id="meterSide"></i></div>
    <p class="meter-label" id="meterLabel">0 / 0 완료</p>
    <div id="route"></div>
    <div class="rail-tools">
      <button class="chip" id="homeBtn">처음 화면</button>
      <button class="chip" id="themeBtn">화면 밝기</button>
      <button class="chip" id="fontBtn">글자 크게</button>
      <button class="chip" id="printBtn">현재 레슨 인쇄</button>
      <button class="chip" id="printAllBtn">전체 인쇄</button>
      <button class="chip" id="resetBtn">진도 초기화</button>
    </div>
  </nav>
  <main class="main"><div class="page" id="page"></div></main>
</div>

<script>
/* ---------- 콘텐츠 ---------- */
const SESSIONS = [
  {no:"시작", name:"초보자 출발", desc:"Cowork·도구 선택·안전 원칙부터"},
  {no:"1차", name:"Claude Code 첫 바퀴", desc:"읽히기 → 규칙 → 디자인 → 계획 → 수정 → 테스트"},
  {no:"2차", name:"되돌리기와 기록", desc:"Rewind·Git·진행 기록으로 안전하게"},
  {no:"3차", name:"Skill 만들기", desc:"사용 → 이해 → 수정 → 제작"},
  {no:"4차", name:"전문가 검수 체계", desc:"Subagent·교육 품질·다중 AI 교차검수"},
  {no:"5차", name:"자동화와 보안", desc:"Scheduled Task·Hook·권한·데이터 경계"},
  {no:"6차", name:"배포와 운영", desc:"GitHub Pages·GAS·공개 URL·허브"},
  {no:"7차", name:"확장: 개발 도구 생태계", desc:"스킬 지도·자동 테스트·Skill 제작·Git 흐름·컨텍스트·MCP·Agent Team"},
  {no:"사례", name:"내 프로젝트 회고", desc:"확인된 사실과 남은 과제를 구분해 돌아보기"},
  {no:"부록", name:"전문가 도약", desc:"명령·Skill 설계·복습·나의 프로젝트"}
];

const SAMPLE_HTML = `<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>진로활동 기록 초안 도우미</title>
</head>
<body>
  <h1>진로활동 기록 초안 도우미</h1>
  <p>실명·학번·연락처·성적은 입력하지 마세요.</p>

  <form id="recordForm">
    <label>가명 또는 학생 코드
      <input type="text" id="studentCode" placeholder="예: 학생A">
    </label>
    <label>활동 내용
      <textarea id="activity"></textarea>
    </label>
    <label>학생의 역할
      <input type="text" id="role">
    </label>
    <label>배운 점
      <textarea id="learning"></textarea>
    </label>
    <label>후속 탐구 계획
      <textarea id="next"></textarea>
    </label>

    <button type="button" id="makeBtn">초안 만들기</button>
    <button type="button" id="resetBtn">전체 초기화</button>
  </form>
  <pre id="result" aria-live="polite"></pre>
  <p>생성 문장은 기록 작성을 돕는 초안입니다. 문장 연결, 학생의 실제 역할과 배운 점, 사실 여부를 교사가 반드시 확인하고 수정하세요.</p>

  <script>
    document.getElementById('makeBtn').addEventListener('click', () => {
      const code = document.getElementById('studentCode').value.trim() || '학생A';
      const activity = document.getElementById('activity').value.trim();
      const role = document.getElementById('role').value.trim();
      const learning = document.getElementById('learning').value.trim();
      const next = document.getElementById('next').value.trim();
      const result = document.getElementById('result');

      if (!activity || !role || !learning || !next) {
        result.textContent = '활동 내용, 역할, 배운 점, 후속 탐구 계획을 모두 입력하세요.';
        return;
      }

      result.textContent =
        code + '의 활동 기록 초안: 활동 내용 「' + activity + '」에서 「' + role + '」 역할을 수행함. ' +
        '배운 점으로 「' + learning + '」 내용을 정리하고, 후속 탐구로 「' + next + '」 주제를 설정함.';
    });

    document.getElementById('resetBtn').addEventListener('click', () => {
      document.getElementById('recordForm').reset();
      document.getElementById('result').textContent = '';
      document.getElementById('studentCode').focus();
    });
  <\/script>
</body>
</html>`;

{s:5, id:"scheduled", no:"5-1", title:"반복 업무를 Scheduled Task로 넘기기",
 goal:"성공한 업무 절차 중 ‘시간이 되면 자동으로 반복할 것’만 예약 작업으로 전환합니다.",
 blocks:[
  {t:"p", h:"Scheduled Task는 Skill과 다릅니다. Skill은 <b>어떻게 할지</b>, Scheduled Task는 <b>언제 반복할지</b>를 정합니다. 예약 결과는 자동 확정본이 아니라 내가 확인하고 필요한 부분을 수정하는 작업물로 취급합니다."},
  {t:"prompt", c:"매주 월요일 아침에 지난주 업무 자료를 정리하는 예약 작업을 만들고 싶어.\n\n먼저 예약하기 전에 확인할 것부터 알려줘.\n- 사용할 자료가 클라우드에서 접근 가능한가\n- 개인정보가 포함되는가\n- 매번 같은 기준으로 처리 가능한가\n- 결과를 사람이 검토해야 하는가\n\n조건이 맞으면 안전한 작업 지시문 초안을 만들어줘.\n\n학생 개인정보, 외부 발송, 파일 삭제, 공개 게시와 관련된 작업은 자동 확정하지 말고 검토가 필요한 항목으로 표시해줘."},
  {t:"warn", h:"로컬 폴더와 예약 작업", b:"현재 공식 안내 기준 예약 작업은 기본적으로 원격에서 실행되어 컴퓨터가 꺼져 있어도 일정에 따라 동작합니다. 다만 로컬 파일이나 앱이 필요한 작업으로 구성하면 로컬에서만 실행될 수 있으며, 이때는 해당 컴퓨터와 Desktop 앱 상태가 중요합니다. 반복 업무는 가능하면 Connector나 Claude 계정에 저장된 파일처럼 원격에서 안정적으로 접근 가능한 자료를 우선 사용하고, 로컬 자원이 필요한 경우 실행 조건을 따로 확인합니다."},
  {t:"resource", h:"Scheduled Tasks 공식 도움말", u:"https://support.claude.com/en/articles/13854387-schedule-recurring-tasks-in-claude-cowork", b:"예약 작업의 원격 실행, Connector 활용, 로컬 파일·앱이 필요한 경우의 예외 확인"},
  {t:"table", head:["기능","어디서 도나","언제 쓰나"], rows:[
   ["Cowork Scheduled Task","Claude 앱(Cowork)","문서 정리·자료 수집 같은 일반 업무의 정기 실행"],
   ["/loop","지금 열려 있는 Claude Code 세션","세션이 열려 있는 동안 일정 간격으로 같은 확인 반복"],
   ["/schedule (Routine)","Claude Code 클라우드","저장소를 대상으로 한 개발 작업의 정기·자동 실행"]]},
  {t:"call", h:"헷갈리지 않는 기준", b:"일반 업무면 Cowork Scheduled Task, 코딩 중 잠깐 지켜볼 일이면 /loop, 내 컴퓨터가 꺼져 있어도 저장소 작업을 정기적으로 돌려야 하면 /schedule입니다. /schedule의 실행 조건(저장소 연결, 사용 한도)은 쓰기 전에 공식 문서로 확인합니다."}
 ],
 checks:["Skill과 Scheduled Task의 차이를 말할 수 있다","Scheduled Task·/loop·/schedule의 쓰임을 구분할 수 있다","정기 실행 전에 자료 접근성과 개인정보를 확인했다"]},

{s:5, id:"l14", no:"5-2", title:"[심화] Hook — 배포 전 자동 점검 연결하기",
 goal:"반복 배포를 지속적으로 관리할 때만, 안전한 검사부터 이벤트 기반 자동 실행으로 연결합니다.",
 blocks:[
  {t:"p", h:"이 기능은 GitHub Pages에 여러 도구를 반복 배포할 때 유용하며, 첫 바퀴에서는 건너뛰어도 됩니다. Skill은 ‘어떻게 할지’를 알려주는 업무 매뉴얼이고, Hook은 특정 이벤트에 맞춰 정해 둔 명령·검사를 실행하도록 연결하는 장치입니다."},
  {t:"flow", items:["JavaScript 수정 (파일 수정 후 이벤트)","Hook 실행","검사","오류가 있으면 Claude에게 전달"]},
  {t:"code", f:".claude/settings.json 예시 — macOS·Linux·Git Bash 기준, 형식은 최신 공식 문서 확인", c:"{\n  \"hooks\": {\n    \"PostToolUse\": [\n      {\n        \"matcher\": \"Write|Edit\",\n        \"hooks\": [\n          {\n            \"type\": \"command\",\n            \"command\": \"grep -RniE 'password|api[_-]?key|secret|token' --include='*.html' --include='*.js' . >&2 && exit 2 || exit 0\"\n          }\n        ]\n      }\n    ]\n  }\n}"},
  {t:"me", h:"첫 Hook 추천", b:"이 실습처럼 단일 HTML 프로젝트에서는 package.json이 필요한 npm test보다 비밀정보 후보 검색처럼 가벼운 검사가 적합합니다. 위 예시는 수상한 단어를 찾으면 stderr로 내용을 보내고 종료 코드 2로 끝냅니다. PostToolUse에서는 작업 자체를 되돌리지는 못하지만 Claude가 그 경고를 보고 다음 수정에 반영할 수 있습니다. 검색 결과는 오탐이 있을 수 있으므로 최종 판단은 사람이 합니다. Windows PowerShell 환경에서는 명령 문법을 환경에 맞게 바꾸세요."},
  {t:"warn", h:"주의", b:"Hook은 내 컴퓨터 권한으로 실제 명령을 실행합니다. 남이 만든 Hook은 무엇을 실행하는지 읽어 본 뒤 설치합니다. PostToolUse에서 종료 코드 0의 일반 출력은 대부분 디버그 로그로 가며 Claude가 보지 못할 수 있고, 경고를 Claude에게 전달하려면 종료 코드 2나 공식 JSON 출력 형식을 사용합니다. Hook이 잘못 만들어지면 검사도 틀립니다."}
 ],
 checks:["Skill과 Hook의 차이를 말할 수 있다","내가 ‘매번 하는 검사’ 하나를 골랐다"]},

{s:5, id:"l15", no:"5-3", title:"Permission: 열쇠를 어디까지 줄까",

{s:7, id:"x2", no:"7-2", title:"webapp-testing으로 수능최저 자가진단 자동 테스트",
 goal:"손으로 누르던 반복 검수를 Playwright 스크립트로 바꾸고, 원본 엑셀과 같은 결과가 나오는지 표본으로 대조합니다.",
 blocks:[
  {t:"p", h:"1-7에서 사람이 하던 확인 중 반복되는 부분을 자동화합니다. 대상은 입력칸·버튼·판정 결과가 많은 수능최저 자가진단입니다. 사람의 최종 확인은 그대로 남깁니다."},
  {t:"code", f:"준비 (한 번만)", c:"pip install playwright\npython -m playwright install chromium"},
  {t:"code", f:"폴더 구조", c:"suneung-selfcheck/\n├─ index.html\n├─ app.js\n├─ data-config.js\n├─ data-scores.js\n├─ data-admissions.js\n└─ tests/\n   ├─ cases.json      ← 원본 엑셀에서 뽑은 표본\n   ├─ run_tests.py    ← Playwright 스크립트\n   └─ shots/          ← 실패 스크린샷"},
  {t:"flow", items:["원본 엑셀에서 표본 사례를 직접 뽑아 cases.json 작성","Claude에게 index.html·app.js를 읽혀 실제 선택자 확인","webapp-testing으로 테스트 스크립트 작성","로컬 서버에서 실행","불일치 사례만 보고받기","원인 확인 후 최소 수정","전체 재실행"]},
  {t:"code", f:"tests/cases.json 예 (값은 원본 엑셀에서 직접 확인)", c:"[\n  {\"name\": \"정상 충족\", \"input\": {...}, \"expect\": \"충족\"},\n  {\"name\": \"경계값: 등급 합이 기준과 같음\", \"input\": {...}, \"expect\": \"충족\"},\n  {\"name\": \"경계값: 기준보다 1 부족\", \"input\": {...}, \"expect\": \"미충족\"},\n  {\"name\": \"복합 조건: 탐구 1과목 반영\", \"input\": {...}, \"expect\": \"[원본에서 확인]\"}\n]"},
  {t:"warn", h:"기대값은 AI에게 만들게 하지 않기", b:"expect 값을 Claude가 추측하면 ‘틀린 정답지로 채점’하는 셈입니다. 기대값은 반드시 원본 엑셀(.xlsm)에 같은 입력을 넣어 직접 확인해 적습니다. 정상·경계값·복합 조건을 섞어 10~20개면 충분합니다."},
  {t:"prompt", c:"webapp-testing 스킬을 사용해줘.\n\n대상: 이 폴더의 수능최저 자가진단 (정적 HTML)\n1. 먼저 index.html과 app.js를 읽고 입력칸·버튼·결과 영역의 실제 선택자를 표로 정리해줘. 아직 테스트를 쓰지 마.\n2. 내가 확인하면 tests/run_tests.py를 작성해줘.\n   - python -m http.server 8000 으로 띄운 로컬 서버 기준\n   - tests/cases.json의 각 사례를 입력하고 결과 문구를 expect와 비교\n   - 빈 입력, 아주 긴 문자열, 360px 모바일 폭도 확인\n   - 브라우저 Console error 수집\n   - 실패 사례는 tests/shots/에 스크린샷 저장\n3. 결과는 통과/실패 개수, 실패 사례 이름, 실제값과 기대값만 보고해줘.\n\n같은 실패를 3번 고쳐도 해결되지 않으면 수정을 멈추고 원인 후보를 보고해줘.\ncases.json의 expect 값은 절대 수정하지 마."},
  {t:"code", f:"run_tests.py 뼈대 (선택자는 실제 HTML 기준으로 교체)", c:"import json\nfrom playwright.sync_api import sync_playwright\n\ncases = json.load(open('tests/cases.json', encoding='utf-8'))\nerrors = []\n\nwith sync_playwright() as p:\n    browser = p.chromium.launch(headless=True)\n    page = browser.new_page()\n    page.on('console', lambda m: errors.append(m.text) if m.type == 'error' else None)\n    page.goto('http://localhost:8000')\n    page.wait_for_load_state('networkidle')\n    # for c in cases: 입력 → 판정 버튼 클릭 → 결과 문구 비교\n    browser.close()\n\nprint('console errors:', len(errors))"},
  {t:"code", f:"실행", c:"python -m http.server 8000\n# 다른 터미널에서\npython tests/run_tests.py"},
  {t:"me", h:"이 테스트의 진짜 가치", b:"매년 data-scores.js·data-admissions.js를 교체할 때 같은 cases.json을 다시 돌리면 ‘데이터만 바꿨는데 로직이 깨졌는지’를 몇 초 만에 확인할 수 있습니다. 정시 탐색기·5등급 분석기에도 같은 tests/ 구조를 복사해 씁니다."},
  {t:"tip", h:"내 프로젝트 사례", b:"수능최저 자가진단: 원본 대조가 먼저", to:"case-suneung"}
 ],
 checks:["원본 엑셀에서 직접 확인한 표본 10개 이상으로 cases.json을 만들었다","run_tests.py가 통과/실패 개수와 Console 오류 수를 보고했다","expect 값을 AI가 바꾸지 못하게 지시했다"]},

  {t:"prompt", c:"skill-creator 스킬을 사용해서 github-pages-review Skill을 만들어줘.\n\n이 Skill이 하는 일:\n- 내 GitHub Pages 저장소를 push하기 전에 점검\n- 상대경로, 파일명 대소문자, 404 가능성, 외부 링크, Console 오류, 캐시 문제 확인\n- lhk15 포털 data.js 등록 형식이 기존 항목과 같은지 확인\n- 결과는 반드시 수정 / 권장 / 문제 없음으로 구분\n\n하지 않는 일:\n- 파일 수정, git push, 배포\n\n먼저 SKILL.md 초안과, 자동 호출 확인용 테스트 요청(호출돼야 함 3개, 호출되면 안 됨 2개)을 제시해줘."},
  {t:"code", f:"테스트 요청 예", c:"[호출돼야 함]\n- 이거 push 전에 한번 봐줘\n- 배포했는데 휴대폰에서 이미지가 안 떠\n- 새 도구를 포털에 올려도 되는지 점검해줘\n\n[호출되면 안 됨]\n- 이 함수 이름 바꿔줘\n- 세특 문장 다듬어줘"},
  {t:"call", h:"description이 Skill의 절반", b:"Claude는 평소 Skill의 이름과 설명만 봅니다. 테스트에서 엉뚱하게 호출되거나 불리지 않으면 본문보다 description부터 고칩니다."},
  {t:"me", h:"다음 후보", b:"같은 방식으로 gas-sheets-backend(5-6 체크리스트), portal-register(6-1)를 만듭니다. 한 번에 하나씩, 실제 작업에 한 번 써 본 뒤 다음으로 넘어갑니다."}
 ],
 checks:["github-pages-review Skill을 skill-creator로 만들었다","호출 테스트 5개를 돌려 description을 한 번 이상 고쳤다"]},

{s:7, id:"x4", no:"7-4", title:"Git 흐름: 브랜치 → 검수 → PR → 내가 승인",
 goal:"main에서 바로 고치지 않고, 변경마다 브랜치를 만들어 검수한 뒤 내가 승인해 합치는 흐름을 익힙니다.",
 blocks:[
  {t:"p", h:"내 저장소들처럼 main 브랜치를 Pages 배포 소스로 쓰는 경우, main에 직접 반영한 변경은 그대로 배포로 이어질 수 있습니다. 배포 소스(브랜치·/docs 폴더·GitHub Actions)는 저장소마다 다를 수 있으니 Settings → Pages에서 먼저 확인합니다. 혼자 운영해도 브랜치와 PR(Pull Request)을 쓰면 ‘변경 묶음 + 검수 기록 + 승인 지점’이 생깁니다."},
  {t:"flow", items:["git switch -c fix/작업이름","Claude가 수정","테스트 (7-2 스크립트 포함)","git diff 검토","final-reviewer + privacy-review","commit","push 후 PR 생성","PR 화면에서 diff 확인 후 내가 merge","Pages 빌드 완료 확인 후 공개 URL 재검수"]},
  {t:"code", f:"터미널", c:"git switch -c fix/mobile-button\n# 수정·테스트 후\ngit add -A\ngit commit -m \"fix: 모바일 판정 버튼 터치 영역 확대\"\ngit push -u origin fix/mobile-button\ngh pr create --fill"},
  {t:"p", h:"<code>gh</code>는 GitHub CLI입니다. 설치 후 <code>gh auth login</code>으로 한 번 로그인해야 합니다. 없으면 push 후 GitHub 웹 화면의 ‘Compare & pull request’ 버튼으로 같은 일을 할 수 있습니다."},
  {t:"prompt", c:"새 브랜치 fix/[작업이름]을 만들고 아래 작업을 해줘.\n[작업 내용]\n\n수정 후:\n1. 테스트를 실행하고 결과를 보고\n2. git diff를 쉬운 말로 요약\n3. final-reviewer와 privacy-review로 검수\n4. 커밋 메시지 초안 제시\n\ncommit까지만 하고 push·PR 생성·merge는 내가 확인한 뒤에 할게."},
  {t:"warn", h:"merge 버튼은 내 몫", b:"PR 생성까지는 맡겨도 되지만, Pages가 main을 배포 소스로 쓰는 저장소라면 merge 후 빌드가 정상 완료되는 순간 공개 사이트에 반영됩니다. 그래서 merge는 직접 합니다. 5-3에서 git push를 ask로 두었다면 그 확인 창도 마지막 안전장치가 됩니다."}
 ],
 checks:["Settings → Pages에서 내 저장소의 배포 소스를 확인했다","브랜치를 만들어 작업하고 PR 화면에서 diff를 직접 보고 merge했다"]},

{s:7, id:"x5", no:"7-5", title:"Context Engineering: 필요한 것만 읽히기",
 goal:"큰 데이터 파일과 긴 대화 때문에 Claude가 핵심을 놓치지 않도록, 읽힐 범위를 설계합니다.",
 blocks:[
  {t:"p", h:"Claude가 한 번에 볼 수 있는 컨텍스트 창은 한정돼 있습니다. 수천 건이 든 data-admissions.js를 통째로 읽히면 정작 고칠 app.js의 규칙이 밀려납니다. 정확도는 ‘많이 주기’가 아니라 ‘맞게 주기’에서 나옵니다."},
  {t:"table", head:["상황","나쁜 방식","좋은 방식"], rows:[
   ["큰 데이터 파일","파일 전체 읽기","앞부분·키 목록·건수로 구조만 확인, 필요한 항목은 검색"],
   ["버그 수정","‘전체 보고 고쳐줘’","오류 메시지 + 관련 파일 2~3개 + 재현 절차"],
   ["넓은 탐색","메인 대화에서 전부 검색","Subagent에게 탐색을 맡기고 요약만 받기"],
   ["긴 작업","한 대화로 끝까지","/context 확인 → 같은 작업이면 /compact, 단계가 바뀌면 progress.md 저장 → /clear"],
   ["반복 규칙","매번 설명","CLAUDE.md에 한 줄로 고정"]]},
  {t:"code", f:"CLAUDE.md에 추가할 규칙 예", c:"## 컨텍스트 규칙\n- data-*.js는 전체를 읽지 않는다. 구조는 앞 30줄과 키 목록으로 확인하고, 특정 항목은 검색으로 찾는다.\n- 요청에 관련 파일이 명시되면 그 파일부터 읽는다.\n- 저장소 전체 탐색이 필요하면 Subagent로 조사하고 요약만 가져온다."},
  {t:"prompt", c:"app.js에서 ‘탐구 1과목 반영’ 판정이 틀리는 문제를 고치려고 해.\n관련 파일: app.js, data-config.js\ndata-admissions.js는 전체를 읽지 말고 해당 모집단위만 검색해서 확인해줘.\n먼저 어떤 파일의 어느 부분을 읽을지 목록부터 보여줘."},
  {t:"p", h:"대화가 길어지면 무조건 새로 시작하기보다, 작업이 이어지는지에 따라 정리 방식을 고릅니다."},
  {t:"table", head:["상황","명령","결과"], rows:[
   ["얼마나 찼는지 모름","/context","컨텍스트 구성과 사용량 확인"],
   ["같은 작업을 계속함","/compact","대화를 요약해 공간을 비우고 흐름은 유지"],
   ["작업 단계가 완전히 바뀜","progress.md 저장 → /clear","기록은 파일에 남기고 새 대화로 시작"]]},
  {t:"code", f:"요약 방향을 지정한 /compact", c:"/compact 확정한 계획, 바꾼 파일 목록, 남은 할 일, 실패한 시도와 원인만 남겨줘"}
 ],
 checks:["CLAUDE.md에 데이터 파일 읽기 규칙을 추가했다","/context로 사용량을 확인하고 /compact와 /clear 중 상황에 맞는 것을 골라 써 봤다"]},

{s:7, id:"x6", no:"7-6", title:"MCP: Claude를 외부 도구와 연결하기",
 goal:"MCP가 무엇을 해결하는지, Claude Code에 어떻게 붙이는지, 직접 만들 때 무엇을 조심하는지 이해합니다.",
 blocks:[
  {t:"p", h:"MCP(Model Context Protocol)는 Claude가 외부 서비스의 도구를 같은 방식으로 호출하게 해 주는 표준입니다. 파일만 고치던 Claude가 시트 조회, 이슈 확인, DB 질의 같은 일을 직접 할 수 있게 됩니다."},
  {t:"table", head:["구분","Claude 앱 Connector","Claude Code MCP"], rows:[
   ["설정 위치","앱 설정 화면","claude mcp 명령·설정 파일"],
   ["주 용도","대화·Cowork 업무","코드 작업 중 외부 데이터 활용"],
   ["범위","계정 단위","사용자·프로젝트 범위 선택"]]},
  {t:"code", f:"원격 MCP 서버 추가 (형식은 공식 문서로 재확인)", c:"claude mcp add --transport http 서버이름 https://서버주소/mcp\n\n# Claude Code 안에서 연결 상태 확인\n/mcp"},
  {t:"p", h:"공개된 서버가 없으면 <b>mcp-builder</b> 스킬로 직접 만들 수 있습니다. Python(FastMCP)이나 TypeScript(MCP SDK)로 도구를 정의하는 방법을 안내합니다."},
  {t:"prompt", c:"mcp-builder 스킬로 MCP 서버를 설계만 해줘. 아직 코드는 쓰지 마.\n\n목적: 내 Google Sheets 기반 도구의 데이터를 Claude Code에서 조회\n1단계 범위: 읽기 전용 도구 2개 (시트 목록, 특정 범위 조회)\n\n1. 도구 이름과 입력·출력 형식\n2. 인증 정보를 어디에 둘지 (코드·저장소에 넣지 않는 방법)\n3. 출력이 너무 커지지 않게 하는 제한\n4. 나중에 쓰기 도구를 추가할 때의 위험\n을 정리해줘."},
  {t:"warn", h:"MCP 서버는 권한 그 자체", b:"연결한 서버가 할 수 있는 일은 Claude도 할 수 있게 됩니다. 처음엔 읽기 전용 도구만 만들고, 토큰·키는 환경변수로 관리하며, 학생 실명 데이터가 있는 시트는 연결 대상에서 뺍니다. 남이 만든 MCP 서버는 어떤 도구를 노출하는지 먼저 확인합니다."}
 ],
 checks:["Connector와 Claude Code MCP의 차이를 말할 수 있다","읽기 전용부터 시작해야 하는 이유를 설명할 수 있다"]},

{s:7, id:"x7", no:"7-7", title:"[심화] 병렬 Subagent · 위험 명령 차단 · Supabase 비교",
 goal:"Subagent를 동시에 쓰는 기준, 위험 명령을 실행 전에 막는 방법, GAS+Sheets 다음 선택지를 정리합니다.",
 blocks:[
  {t:"p", h:"<b>① 병렬 Subagent</b> — 서로 결과를 기다릴 필요가 없는 일만 동시에 맡깁니다. 배포 전 3종 검수가 대표적입니다."},
  {t:"prompt", c:"다음 세 검수를 각각 별도 Subagent로 동시에 실행하고, 끝나면 결과를 하나의 표로 합쳐줘.\n1. 기능·모바일·Console 검수 (final-reviewer)\n2. 개인정보·Secret 검수 (privacy-review 기준)\n3. 교육 콘텐츠 검수 (education-content-review 기준)\n\n각 Subagent는 파일을 수정하지 말고 문제만 보고해.\n합칠 때 중복 지적은 하나로 묶고 위험도 순으로 정렬해줘."},
  {t:"call", h:"나눌 가치가 있을 때만", b:"Subagent마다 컨텍스트와 사용량이 따로 듭니다. 한 파일 수정처럼 작은 일은 메인 Claude 하나가 더 빠릅니다. 서로 의존하는 작업(설계 → 구현)은 순서대로 합니다."},
  {t:"p", h:"<b>② 위험 명령 차단</b> — 1차 방어는 5-3의 permission deny 규칙, 2차 방어가 PreToolUse Hook입니다. 5-2의 PostToolUse가 실행 <b>후</b> 경고라면, PreToolUse는 실행 <b>전</b>에 돌기 때문에 종료 코드 2로 끝나면 그 명령 자체가 막히고 stderr 내용이 Claude에게 전달됩니다."},
  {t:"code", f:".claude/settings.json 예시 — jq 필요, macOS·Linux·Git Bash 기준", c:"{\n  \"permissions\": {\n    \"deny\": [\"Bash(rm -rf *)\", \"Bash(git push --force *)\"]\n  },\n  \"hooks\": {\n    \"PreToolUse\": [\n      {\n        \"matcher\": \"Bash\",\n        \"hooks\": [\n          {\n            \"type\": \"command\",\n            \"command\": \"jq -r '.tool_input.command' | grep -qE 'rm -rf|push --force|reset --hard' && { echo '위험 명령이라 차단했습니다. 사람 확인이 필요합니다.' >&2; exit 2; } || exit 0\"\n          }\n        ]\n      }\n    ]\n  }\n}"},
  {t:"warn", h:"Hook은 보조 장치", b:"문자열 검사는 우회될 수 있고 오탐도 생깁니다. 권한 설정·Git 기록·사람 승인을 대신하지 않습니다. 형식은 설정 직전에 공식 Hooks 문서와 /hooks 화면으로 다시 확인합니다."},
  {t:"p", h:"<b>③ GAS+Sheets 다음 선택지</b> — Supabase는 Postgres 데이터베이스에 인증과 행 단위 권한(RLS)을 붙여 주는 서비스입니다."},
  {t:"table", head:["기준","GAS + Sheets","Supabase"], rows:[
   ["시작 난이도","낮음, 학교 계정으로 바로","중간, SQL·권한 정책 학습 필요"],
   ["동시 접속","몰리면 느려지거나 충돌 가능","DB 수준에서 처리"],
   ["권한 관리","스크립트 코드로 직접 구현","RLS 정책으로 행 단위 제어"],
   ["데이터 확인","시트를 눈으로 바로 확인","관리 화면·SQL로 확인"],
   ["비용·제한","Google 할당량 범위","무료 플랜 한도 있음 [가입 시 확인]"]]},
  {t:"me", h:"내 판단 기준", b:"공개 자료 기반 도구는 GitHub Pages 단독, 소규모 입력·조회는 GAS+Sheets 유지. 여러 명이 동시에 쓰고 사람별 권한이 필요한 도구(예: 외출·외박 신청)가 커지면 그때 Supabase를 검토합니다. 그 경우 supabase-postgres-best-practices 스킬과 privacy-review를 함께 씁니다."}
 ],
 checks:["병렬로 나눌 일과 순서대로 할 일을 구분할 수 있다","PostToolUse와 PreToolUse의 차이를 설명할 수 있다","Supabase로 옮길 조건을 내 말로 적었다"]},


{s:7, id:"x8", no:"7-8", title:"[고급·실험적] Subagent와 Agent Team의 차이",
 goal:"결과만 돌려받는 Subagent와, 독립 세션끼리 서로 조율하는 Agent Team을 구분하고 언제 어느 쪽이 맞는지 판단합니다.",
 blocks:[
  {t:"table", head:["구분","Subagent","Agent Team"], rows:[
   ["구성","메인 세션 안의 보조 작업자","Lead 세션 + 독립된 Claude Code 세션 여러 개"],
   ["소통","결과를 메인에게만 보고, 서로 대화 없음","공유 작업 목록과 메시지로 팀원끼리 직접 조율"],
   ["설정","기본 제공","실험적 기능, 기본 꺼짐"],
   ["비용","상대적으로 적음","팀원마다 전체 세션이라 사용량이 크게 늘어남"],
   ["맞는 일","조사·테스트·리뷰처럼 독립적인 일","서로 발견을 공유하고 반박해야 하는 일"]]},
  {t:"code", f:"구조 비교", c:"Subagent\n  메인 Claude\n   ├─ 조사\n   ├─ 테스트\n   └─ 리뷰\n        ↓\n   메인에게 결과만 반환\n\nAgent Team\n        Lead\n     ┌───┼───┐\n   팀원  팀원  팀원\n     ↔    ↔    ↔\n  공유 작업 목록 · 서로 조율"},
  {t:"code", f:"켜는 방법 (settings.json 또는 환경변수, 형식은 공식 문서 확인)", c:"{\n  \"env\": {\n    \"CLAUDE_CODE_EXPERIMENTAL_AGENT_TEAMS\": \"1\"\n  }\n}"},
  {t:"prompt", c:"agent team을 만들어서 이 도구의 배포 전 검수를 해줘.\n- 팀원 1: 기능·모바일 검수\n- 팀원 2: 개인정보·보안 검수\n- 팀원 3: 앞의 두 팀원의 지적이 타당한지 반박·검증\n\n모든 팀원은 파일을 수정하지 말고, 최종 결과는 Lead가 위험도 순 표 하나로 정리해줘."},
  {t:"warn", h:"지금 내 단계에서는", b:"실험적 기능이라 세션 재개·작업 조율·종료 동작에 알려진 제약이 있고, 사용량도 크게 늘어납니다. 7-7의 병렬 Subagent로 충분한 일이 대부분이므로, ‘팀원끼리 서로 검증해야 결과가 좋아지는 일’이 생겼을 때만 시험해 봅니다. 최소 버전·설정 방식은 시험 직전에 공식 문서로 확인합니다."}
 ],
 checks:["Subagent와 Agent Team의 차이를 소통 방식 기준으로 말할 수 있다","Agent Team이 필요한 일과 아닌 일을 하나씩 들 수 있다"]},

{s:8, id:"case-dorm", no:"사례 1", title:"기숙사 외출·외박 신청 — 완성형보다 운영 가능한 구조",
 goal:"기능을 많이 넣는 것보다 실제 운영 인력·접속 환경·개인정보 경계를 먼저 확인하는 판단을 익힙니다.",
 blocks:[
  {t:"call", h:"사례 기록 원칙", b:"아래 내용은 확인된 작업과 교육적 교훈을 구분해 적었습니다. 실제로 수행했는지 확인되지 않은 내용은 ‘남은 과제’ 또는 ‘점검 기준’으로 표현합니다."},
  {t:"case", title:"기숙사 외출·외박 신청", situation:"당직 사감 교사의 확인 업무를 줄이기 위한 도구. 기존에는 외박 시 학부모 확인 문자를 사감에게 보내는 방식이었다.",
   steps:[
    {v:"v1 설계", did:"GAS+Sheets, 학생 학교 계정, 담임 일괄승인, 자동허가, 현관 QR 복귀, 점호 대조, 당직표 연동까지 포함한 완성형을 설계했다.", problem:"학생마다 학교 계정을 준비해야 하는 부담이 크고, 기능 수가 실제 운영 방식보다 많았다.", fix:"‘최대한 많이 자동화’보다 ‘현장에서 유지 가능한가’를 우선 기준으로 바꾸고 간편판으로 축소했다."},
    {v:"간편판", did:"첫 화면에서 교사용/학생용을 선택하고, 학생은 호실과 이름으로 접속해 첫 사용 때 비밀번호를 설정하도록 했다. 외박은 학부모 확인 문자를 사감에게 보냈다는 확인 뒤 진행하도록 했다.", problem:"휴대폰 사용을 전제로 단순화했지만, Apps Script 웹앱을 메신저에서 다른 브라우저로 열 때 ‘현재 파일을 열 수 없습니다’ 오류가 발생했다.", fix:"화면과 데이터 처리를 한곳에 두는 구조를 다시 검토했다."},
    {v:"v2.2", did:"화면은 GitHub Pages의 별도 저장소로 옮기고 Apps Script는 데이터 처리만 맡도록 역할을 나눴다.", problem:"교사 공통 비밀번호 비교 로직이 공개 화면 코드에 남아 있다면 소스에서 확인될 수 있다.", fix:"남은 점검 과제는 비밀번호 비교 위치를 실제 코드에서 확인하고, 공개 화면에 있다면 서버(GAS) 쪽 검증으로 옮기는 것이다."}
   ],
   result:"현재 확인된 범위는 GitHub Pages와 Apps Script의 역할을 분리한 구조 개선까지입니다. 시범 운영 반응과 비밀번호 검증 위치는 이 사례의 확인된 기록에 포함하지 않습니다.",
   lessons:["설계안의 기능 수가 운영 인력보다 많으면 간편판부터 만든다.","휴대폰·메신저에서 실제로 열리는지 배포 환경을 초기에 시험한다.","공개 화면은 표시를 맡고, 인증·권한 판단은 서버에서 처리한다.","실명·호실·외박 정보처럼 결합 시 식별 가능한 데이터는 최소화하고 접근 범위를 정한다."],
   links:["safety-first","l3","l16","l18"]},
  {t:"note", k:"case-dorm-q", h:"다시 한다면?", b:"① v1 설계안을 받았을 때 가장 먼저 줄였을 기능은 무엇인가요? ② 학생 계정을 쓰지 않는 대신 어떤 보안·운영 문제가 새로 생길까요? ③ GitHub Pages와 GAS의 역할을 어디까지 나누겠습니까?"},
  {t:"prompt", c:"다음 학교 업무 자동화 아이디어를 ‘기능이 많은 완성형’이 아니라 ‘운영 가능한 최소 버전’으로 다시 설계해줘.\n\n업무: [업무]\n실제 운영 인력: [인원/역할]\n주 사용 기기: [휴대폰/PC]\n반드시 필요한 기능: [3개 이내]\n민감 정보: [개인정보/비밀번호/없음]\n\n1. 꼭 필요한 기능과 나중에 붙일 기능을 분리하고\n2. 공개 화면과 서버에서 처리할 일을 나누고\n3. 실제 사용 전에 시험할 접속 환경을 제시해줘.\n모르는 조건은 추측하지 말고 [확인 필요]로 표시해줘."}
 ],
 checks:["완성형보다 운영 가능한 최소 기능을 먼저 정하는 이유를 설명할 수 있다","공개 화면과 서버 검증의 역할을 구분할 수 있다"]},

{s:8, id:"case-checkin", no:"사례 2", title:"행사 QR 출석체크 — 1회용이 아니라 재사용 구조로",
 goal:"반복될 업무인지 먼저 판단하고, 화면과 데이터 처리 구조를 재사용 가능하게 나누는 방법을 익힙니다.",
 blocks:[
  {t:"case", title:"행사 QR 출석체크 + 경품 추첨", situation:"지역 교육단체 정기총회의 출석체크를 간편하게 하고, 비슷한 행사가 반복될 때 다시 사용할 수 있는 구조를 만드는 것이 목표였다.",
   steps:[
    {v:"초기 판단", did:"1회용 공유 링크보다 GitHub Pages + Apps Script + Sheets 조합을 선택했다.", problem:"한 번의 행사만 보면 더 단순한 방식도 가능하지만, 비슷한 행사가 반복되면 매번 새로 만드는 비용이 커진다.", fix:"‘이번 한 번’이 아니라 ‘두 번째 행사에서도 쓸 수 있는가’를 구조 결정 기준으로 삼았다."},
    {v:"기능 확장", did:"출석체크 화면(index.html, 휴대폰용)과 경품 추첨 화면(draw.html, 빔프로젝터용)을 별도 파일로 만들고 같은 Apps Script 백엔드를 공유하도록 설계했다.", problem:"용도가 다른 화면을 하나에 모두 넣으면 현장 화면이 복잡해지고 수정 영향 범위가 커질 수 있다.", fix:"화면은 사용 상황별로 나누고, 데이터 처리는 공통 백엔드에 모으는 원칙을 적용했다."}
   ],
   result:"현재 확인된 범위는 재사용을 고려해 화면을 분리하고 공통 백엔드를 공유하도록 설계한 단계까지입니다. 행사 당일 운영 기록과 다음 행사에서의 변경점은 이 사례에 포함하지 않습니다.",
   lessons:["도구를 만들기 전에 ‘한 번 쓰고 버릴 것인가, 반복할 것인가’를 먼저 정한다.","휴대폰용·빔프로젝터용처럼 사용 맥락이 다르면 화면 파일을 분리한다.","같은 데이터를 쓰는 기능은 백엔드와 데이터 구조를 가능한 한 공유한다.","행사 전 실제 네트워크·QR·화면 크기·공개 URL을 현장에서 다시 시험한다."],
   links:["l18","l19","l22"]},
  {t:"note", k:"case-checkin-q", h:"다시 한다면?", b:"① 어떤 조건이면 1회용 도구가 더 낫고, 어떤 조건이면 재사용 구조가 낫나요? ② 출석 화면과 추첨 화면을 한 파일로 합치면 어떤 문제가 생길 수 있나요? ③ 행사 전에 반드시 현장에서 시험할 항목은 무엇인가요?"},
  {t:"prompt", c:"다음 행사용 도구를 설계하려고 해.\n\n행사 유형: [행사]\n반복 주기: [1회/매년/수시]\n사용 화면: [휴대폰/노트북/빔프로젝터]\n공통 데이터: [명단/출석/추첨 등]\n\n먼저 1회용과 재사용형 중 어느 구조가 더 적절한지 판단 기준을 제시해줘.\n그다음 화면 파일과 공통 데이터 처리 부분을 어떻게 나눌지 설계해줘.\n행사 전 현장 테스트 체크리스트도 만들어줘."}
 ],
 checks:["1회용과 재사용형을 구분하는 기준을 설명할 수 있다","화면과 공통 데이터 처리를 분리하는 이유를 이해했다"]},

{s:8, id:"case-suneung", no:"사례 3", title:"수능최저 자가진단 — 엑셀 로직을 웹으로 옮길 때",
 goal:"복잡한 원본 로직을 웹으로 바꿀 때 ‘새로 만들기’보다 원본 대조·표본 테스트·데이터 분리가 중요하다는 점을 익힙니다.",
 blocks:[
  {t:"case", title:"수능최저 자가진단 웹앱", situation:"VBA/ActiveX 기반 교사용 엑셀 검색기를 학생이 자기 성적을 입력해 충족 여부를 확인하는 정적 웹앱으로 바꾸고 GitHub Pages에 배포하는 프로젝트였다.",
   steps:[
    {v:"원본", did:"최저학력기준 조건식과 모집단위 데이터가 포함된 기존 엑셀 도구를 기준 자료로 삼았다.", problem:"엑셀의 계산 로직을 웹 코드로 다시 작성하면 같은 입력에서 다른 결과가 나올 수 있다.", fix:"이 유형의 변환에서 우선해야 할 검증 과제는 원본과 웹 결과가 일치하는지 표본 사례로 대조하는 것이다."},
    {v:"반복 검수", did:"웹 버전을 여러 차례 검수하며 구조를 개선했다.", problem:"하나의 큰 HTML 안에 화면·로직·데이터가 모두 들어가면 오류 위치를 찾기 어렵고, 다음 연도 데이터 교체도 부담이 커진다.", fix:"화면·앱 로직·설정·성적 기준·전형 데이터를 분리하는 방향으로 구조를 바꿨다."},
    {v:"v3 구조", did:"약 3MB의 단일 HTML을 index.html / app.js / data-config.js / data-scores.js / data-admissions.js 다섯 파일로 분리했다.", problem:"입시 제도·대학 정보는 시점에 따라 바뀌며 웹앱 결과만 믿게 만들면 위험하다.", fix:"남은 점검 과제는 불확실한 정보의 표시 방식과 ‘최종 확인은 대학 모집요강 등 공식 자료’ 안내가 실제 화면에 충분히 드러나는지 검수하는 것이다."}
   ],
   result:"현재 확인된 범위는 단일 HTML을 다섯 파일로 분리한 구조 개선까지입니다. v1·v2의 구체적인 계산 불일치 사례와 원본 엑셀 대조 절차는 이 사례의 확인된 기록에 포함하지 않습니다.",
   lessons:["원본이 있는 변환 프로젝트는 새 기능보다 ‘같은 입력 → 같은 결과’ 검증이 먼저다.","복잡한 데이터는 화면·로직과 분리해 다음 연도 교체 비용을 낮춘다.","표본 테스트는 쉬운 사례·경계값·복합 조건 사례를 섞어 만든다.","입시 결과는 확정 판정처럼 보이지 않게 하고 공식 모집요강 최종 확인을 안내한다."],
   links:["l1","l7","l12","l22"]},
  {t:"note", k:"case-suneung-q", h:"다시 한다면?", b:"① 엑셀 원본과 웹 결과를 비교할 표본 사례는 어떻게 고르겠습니까? ② 데이터와 로직을 분리하지 않으면 다음 연도에 어떤 일이 생길까요? ③ ‘충족’이라는 결과를 학생에게 보여 줄 때 어떤 주의 문구가 필요할까요?"},
  {t:"prompt", c:"기존 엑셀/문서 도구를 웹앱으로 옮기려고 해.\n\n원본: [파일/시트/계산 방식]\n웹앱 목표: [기능]\n매년 바뀌는 데이터: [항목]\n절대 틀리면 안 되는 결과: [항목]\n\n먼저 원본과 웹 결과를 대조할 표본 테스트 계획을 만들어줘.\n정상 사례, 경계값, 복합 조건을 포함하고, 데이터·로직·화면을 어떤 파일로 분리할지도 제안해줘.\n확인할 수 없는 규칙은 추측하지 말고 [확인 필요]로 표시해줘."}
 ],
 checks:["원본 대조용 표본 테스트가 필요한 이유를 설명할 수 있다","데이터와 로직을 분리했을 때의 유지관리 장점을 이해했다"]},

{s:8, id:"case-privacy", no:"사례 4", title:"공개판과 내부판 — 개인정보가 들어가면 배포 경계가 달라진다",
 goal:"같은 기능의 도구라도 데이터 성격에 따라 공개판과 내부판을 분리해야 한다는 판단 기준을 익힙니다.",
 blocks:[

 goal:"Claude Code는 ‘알아서 다 해주는 AI’가 아니라, 규칙을 정하고 계획을 확인하고 결과를 검증하며 함께 일하는 조수입니다.",
 blocks:[
  {t:"flow", items:["목표를 분명히","현재 파일 먼저 읽히기","수정 전 계획 확인","필요한 부분만 수정","실제로 실행","다른 관점에서 다시 검수","Git으로 되돌릴 수 있게","사람이 최종 승인"]},
  {t:"call", h:"교육용 도구에서 하나 더", b:"실제 학생 데이터는 가장 마지막입니다. 가능하면 실제 학생 데이터를 넣지 않고도 업무 목적을 달성하는 구조를 먼저 설계합니다. 가상 데이터로 충분히 만들고 테스트한 뒤 개인정보·외부 서비스·자동화를 다시 검토합니다."},
  {t:"note", k:"first-project", h:"다음에 적용할 업무 1개", b:"예: 공문→메신저, 진로활동 기록 정리, 공개용 진로 웹도구, 반복 보고서 등. 이 메모는 현재 브라우저에만 저장됩니다."},
  {t:"call", h:"전문가가 되는 마지막 과제", b:"실제 업무 하나를 골라 ① requirements.md ② CLAUDE.md ③ DESIGN.md ④ Skill 1개 ⑤ 독립 검수 ⑥ Git 기록 ⑦ 안전한 배포 또는 Cowork 자동화까지 한 사이클을 스스로 완성하세요."}
 ],
 checks:["1차~7차 실습을 모두 한 바퀴 돌았다"]}
];

/* ---------- 상태 ---------- */
const KEY = "claude-teacher-automation-lab-2026-09-30-v4";
let state = {done:{}, checks:{}, quiz:{}, notes:{}, cur:null};
try { const s = localStorage.getItem(KEY); if (s) state = Object.assign(state, JSON.parse(s)); } catch(e){}
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(state)); }catch(e){} }

const $ = s => document.querySelector(s);
const el = (tag, cls, html) => { const n = document.createElement(tag); if (cls) n.className = cls; if (html != null) n.innerHTML = html; return n; };

function toast(msg){
  const t = $("#toast"); if (!t) return; t.textContent = msg; t.classList.add("show");
  clearTimeout(toast._tm); toast._tm = setTimeout(() => t.classList.remove("show"), 1500);
}

function copyBtn(text, cls){
  const b = el("button", "copy" + (cls ? " " + cls : ""), "복사");
  b.addEventListener("click", async () => {
    let ok = false;
    try { await navigator.clipboard.writeText(text); ok = true; } catch(e){
      const ta = document.createElement("textarea"); ta.value = text; document.body.appendChild(ta); ta.select();
      try { ok = document.execCommand("copy"); } catch(_){} ta.remove();
    }
    b.textContent = ok ? "✓ 복사됨" : "직접 선택하세요"; b.classList.toggle("ok", ok); toast(ok ? "클립보드에 복사했습니다." : "자동 복사가 안 되어 직접 선택이 필요합니다.");
    setTimeout(() => { b.textContent = "복사"; b.classList.remove("ok"); }, 1600);
  });
  return b;
}

/* ---------- 렌더: 목차 ---------- */
function renderRoute(){
  const r = $("#route"); r.innerHTML = "";
  SESSIONS.forEach((s, si) => {
    const box = el("div", "session");
    box.appendChild(el("p", "session-name", s.no + " · " + s.name));
    const ul = el("ul", "stops");
    LESSONS.filter(l => l.s === si).forEach(l => {
      const li = el("li", "stop" + (state.done[l.id] ? " done" : "") + (state.cur === l.id ? " current" : ""));
      const b = el("button"); b.appendChild(el("span", "dot")); b.appendChild(el("span", "", l.no + " " + l.title));
      b.addEventListener("click", () => { go(l.id); closeRail(); });
      li.appendChild(b); ul.appendChild(li);
    });
    box.appendChild(ul); r.appendChild(box);
  });
  const n = LESSONS.filter(l => state.done[l.id]).length, pct = Math.round(n / LESSONS.length * 100);
  $("#meterSide").style.width = pct + "%"; $("#meterTop").style.width = pct + "%";
  $("#meterLabel").textContent = n + " / " + LESSONS.length + " 완료 (" + pct + "%)";
}

/* ---------- 렌더: 처음 화면 ---------- */
function renderHome(){
  state.cur = null; save(); renderRoute();
  $("#topTitle").textContent = "Claude Code 학습 노트";
  const p = $("#page"); p.innerHTML = "";
  p.appendChild(el("h1", "hero-title", "Claude Code 학습 노트<br>따라 하며 전문가까지"));
  p.appendChild(el("p", "hero-lead", "Cowork로 업무를 정리하고 Claude Code로 내 도구를 만든 뒤, Skill·검수·배포 체계로 운영하고 개발 도구 생태계로 넓혀 가는 개인 학습 기록입니다. 구성은 시작 과정 + 1~7차 + 내 프로젝트 회고 + 부록입니다."));
  const pgd = el("div", "path-grid");
  [["입문","시작~1차","업무 정리·안전한 준비·첫 도구"],["실전","2~5차","설계·Git·Skill·품질관리·자동화"],["확장","6~7차+부록","배포·운영·테스트 자동화·MCP"]].forEach(x=>{ const c=el("div","path-card"); c.appendChild(el("b","",x[0]+" · "+x[1])); c.appendChild(el("span","",x[2])); pgd.appendChild(c); });
  p.appendChild(pgd);
  const next = LESSONS.find(l => !state.done[l.id]) || LESSONS[0];
  const st = el("button", "start", LESSONS.some(l => state.done[l.id]) ? "이어서 하기: " + next.no + " " + next.title : "첫 실습 시작하기");
  st.addEventListener("click", () => go(next.id)); p.appendChild(st);
  p.appendChild(el("h2", "", "차시별로 보기"));
  const box = el("div", "sessions");
  SESSIONS.forEach((s, si) => {
    const ls = LESSONS.filter(l => l.s === si), d = ls.filter(l => state.done[l.id]).length;
    const b = el("button", "sess-row");
    b.innerHTML = '<span class="sess-no">' + s.no + '</span><span><span class="nm">' + s.name + '</span><span class="ds">' + s.desc + '</span></span><span class="pc">' + d + "/" + ls.length + "</span>";
    b.addEventListener("click", () => go(ls[0].id)); box.appendChild(b);
  });
  p.appendChild(box);
  window.scrollTo(0, 0);
}

/* ---------- 렌더: 실습 ---------- */
function renderBlock(b){
  switch (b.t){
    case "p": return el("p", "", b.h);
    case "prompt": { const d = el("div", "prompt"); d.appendChild(el("div", "who", "Claude에 붙여넣기 · 프롬프트")); const t = el("p", "txt"); t.textContent = b.c; d.appendChild(t); d.appendChild(copyBtn(b.c)); return d; }
    case "code": { const d = el("div", "code"); const h = el("div", "code-head"); h.appendChild(el("span", "", b.f)); h.appendChild(copyBtn(b.c)); d.appendChild(h); const pre = el("pre"); pre.textContent = b.c; d.appendChild(pre); return d; }
    case "flow": { const o = el("ol", "flow"); b.items.forEach(i => o.appendChild(el("li", "", i))); return o; }
    case "list": { const u = el("ul", "plain"); b.items.forEach(i => u.appendChild(el("li", "", i))); return u; }
    case "warn": case "tip": case "call": case "me": {
      const cls = b.t === "call" ? "call" : "call " + b.t;
      const d = el("div", cls); d.appendChild(el("b", "h", b.h)); d.appendChild(el("span", "", b.b));
      if (b.to) { const bt = el("button", "jump-btn", "사례 열기 →"); bt.type = "button"; bt.addEventListener("click", () => go(b.to)); d.appendChild(bt); }
      return d; }
    case "case": {
      const d = el("section", "case-card");
      d.appendChild(el("h3", "", b.title));
      d.appendChild(el("p", "case-situation", b.situation));
      const tl = el("div", "case-timeline");
      (b.steps || []).forEach(st => {
        const step = el("div", "case-step");
        step.appendChild(el("span", "case-ver", st.v));
        const grid = el("div", "case-grid");
        [["한 일", st.did, "case-did"],["문제", st.problem, "case-problem"],["수정", st.fix, "case-fix"]].forEach(x => {
          const c = el("div", "case-cell " + x[2]); c.appendChild(el("b", "", x[0])); c.appendChild(el("span", "", x[1])); grid.appendChild(c);
        });
        step.appendChild(grid); tl.appendChild(step);
      });
      d.appendChild(tl);
      const r = el("div", "case-result"); r.appendChild(el("b", "", "현재 상태")); r.appendChild(el("p", "", b.result)); d.appendChild(r);
      if (b.lessons && b.lessons.length) { d.appendChild(el("b", "", "다른 업무에도 적용할 규칙")); const u = el("ul", "case-lessons"); b.lessons.forEach(x => u.appendChild(el("li", "", x))); d.appendChild(u); }
      if (b.links && b.links.length) { const links = el("div", "case-links"); b.links.forEach(id => { const l = LESSONS.find(x => x.id === id); if (!l) return; const bt = el("button", "", l.no + " " + l.title); bt.type = "button"; bt.addEventListener("click", () => go(id)); links.appendChild(bt); }); d.appendChild(links); }
      return d; }
    case "resource": {
      const d = el("div", "resource");
      const body = el("div");
      const a = el("a", "", b.h); a.href = b.u; a.target = "_blank"; a.rel = "noopener noreferrer";
      body.appendChild(a); body.appendChild(el("small", "", b.b || "")); d.appendChild(body); return d; }
    case "note": {
      const d = el("div", "note-box"), lab = el("label", "", b.h), ta = el("textarea");
      const key = b.k || b.h; ta.id = "note-" + String(key).replace(/[^a-zA-Z0-9_-]/g, "_"); lab.htmlFor = ta.id; ta.value = (state.notes && state.notes[key]) || ""; ta.placeholder = b.b || "";
      ta.addEventListener("input", () => { state.notes = state.notes || {}; state.notes[key] = ta.value; save(); });
      d.appendChild(lab); d.appendChild(ta); d.appendChild(el("small", "", b.b || "")); return d; }
    case "table": {
      const w = el("div", "tbl"), t = el("table"), th = el("tr");
      b.head.forEach(h => th.appendChild(el("th", "", h))); const thead = el("thead"); thead.appendChild(th); t.appendChild(thead);
      const tb = el("tbody"); b.rows.forEach(r => { const tr = el("tr"); r.forEach(c => tr.appendChild(el("td", "", c))); tb.appendChild(tr); });
      t.appendChild(tb); w.appendChild(t); return w; }
  }
  return el("div");
}

function renderQuizPrint(l, p){
  const d = el("section", "quiz-print print-only"); d.appendChild(el("h2", "", "OX 문제 (인쇄용)"));
  l.quiz.forEach((q, i) => {
    const it = el("div", "qp");
    it.appendChild(el("p", "", (i + 1) + ". " + q[0]));
    it.appendChild(el("p", "qp-box", "□ O　　□ X"));
    const a = el("p", "qp-ans"); a.textContent = "정답: " + (q[1] ? "O" : "X") + " · " + q[2]; it.appendChild(a);
    d.appendChild(it);
  });
  p.appendChild(d);
}

function renderQuiz(l, p){
  l.quiz.forEach((q, i) => {
    const key = l.id + i, d = el("div", "q"); d.appendChild(el("p", "", (i + 1) + ". " + q[0]));
    const ox = el("div", "ox"), ans = el("div", "ans");
    const show = pick => {
      const right = pick === q[1];
      ans.innerHTML = '<b class="' + (right ? "right" : "wrong") + '">' + (right ? "정답" : "다시 보기") + "</b> · 답은 " + (q[1] ? "O" : "X") + ". " + q[2];
      d.classList.add("answered");
      d.classList.toggle("is-correct", right);
      d.classList.toggle("is-wrong", !right);
    };
    ["O","X"].forEach(v => { const bt = el("button", "", v); bt.addEventListener("click", () => { state.quiz[key] = v === "O"; save(); show(v === "O"); }); ox.appendChild(bt); });
    d.appendChild(ox); d.appendChild(ans);
    if (key in state.quiz) show(state.quiz[key]);
    p.appendChild(d);
  });
}

function go(id){
  const idx = LESSONS.findIndex(l => l.id === id); if (idx < 0) return renderHome();
  const l = LESSONS[idx]; state.cur = id; save(); renderRoute();
  $("#topTitle").textContent = l.no + " " + l.title;
  const p = $("#page"); p.innerHTML = "";
  p.appendChild(el("p", "crumb", SESSIONS[l.s].no + " " + SESSIONS[l.s].name + " / " + l.no));
  p.appendChild(el("h1", "", l.title));
  const g = el("div", "goal"); g.appendChild(el("b", "", "이번 목표")); g.appendChild(el("span", "", l.goal)); p.appendChild(g);
  l.blocks.forEach(b => p.appendChild(renderBlock(b)));
  if (l.quiz) { renderQuiz(l, p); renderQuizPrint(l, p); }

  const ck = el("section", "checks"); ck.appendChild(el("h2", "", "성공 확인"));
  const saved = state.checks[id] || [];
  const btn = el("button", "done-btn");
  const refresh = () => {
    const all = (state.checks[id] || []).filter(Boolean).length === l.checks.length;
    if (state.done[id]) { btn.textContent = "완료함 · 다시 풀려면 누르기"; btn.className = "done-btn is-done"; btn.disabled = false; }
    else { btn.textContent = all ? "이 실습 완료" : "확인 항목을 모두 체크하세요"; btn.className = "done-btn"; btn.disabled = !all; }
  };
  l.checks.forEach((c, i) => {
    const lab = el("label"), cb = el("input"); cb.type = "checkbox"; cb.checked = !!saved[i];
    cb.addEventListener("change", () => { const a = state.checks[id] || []; a[i] = cb.checked; state.checks[id] = a; if (!cb.checked) delete state.done[id]; save(); refresh(); renderRoute(); });
    lab.appendChild(cb); lab.appendChild(el("span", "", c)); ck.appendChild(lab);
  });
  btn.addEventListener("click", () => {
    if (state.done[id]) { delete state.done[id]; } else { state.done[id] = true; }
    save(); refresh(); renderRoute();
    if (state.done[id] && LESSONS[idx + 1]) setTimeout(() => go(LESSONS[idx + 1].id), 350);
  });
  refresh(); ck.appendChild(btn); p.appendChild(ck);

  const pg = el("div", "pager"), prev = LESSONS[idx - 1], next = LESSONS[idx + 1];
  const pb = el("button", "", prev ? "<small>이전</small>" + prev.no + " " + prev.title : ""); pb.disabled = !prev; if (prev) pb.addEventListener("click", () => go(prev.id));
  const nb = el("button", "nx", next ? "<small>다음</small>" + next.no + " " + next.title : ""); nb.disabled = !next; if (next) nb.addEventListener("click", () => go(next.id));
  pg.appendChild(pb); pg.appendChild(nb); p.appendChild(pg);
  window.scrollTo(0, 0);
}

/* ---------- 기타 ---------- */
const rail = $("#rail"), scrim = $("#scrim");
function closeRail(){ rail.classList.remove("open"); scrim.classList.remove("show"); }
$("#menuBtn").addEventListener("click", () => { rail.classList.add("open"); scrim.classList.add("show"); });
scrim.addEventListener("click", closeRail);
$("#homeBtn").addEventListener("click", () => { renderHome(); closeRail(); });
$("#printBtn").addEventListener("click", () => {
  if (!state.cur) { toast("레슨을 연 뒤 인쇄하세요."); return; }
  closeRail(); setTimeout(() => window.print(), 50);
});
$("#printAllBtn").addEventListener("click", () => {
  const restore = state.cur;
  const p = $("#page"); p.innerHTML = "";
  p.appendChild(el("h1", "hero-title", "Claude Code 학습 노트 · 전체 인쇄본"));
  LESSONS.forEach(l => {
    const sec = el("section", "print-lesson");
    sec.appendChild(el("p", "crumb", SESSIONS[l.s].no + " " + SESSIONS[l.s].name + " / " + l.no));
    sec.appendChild(el("h1", "", l.title));
    const g = el("div", "goal"); g.appendChild(el("b", "", "이번 목표")); g.appendChild(el("span", "", l.goal)); sec.appendChild(g);
    l.blocks.forEach(b => sec.appendChild(renderBlock(b)));
    if (l.quiz) renderQuizPrint(l, sec);
    p.appendChild(sec);
  });
  closeRail();
  setTimeout(() => window.print(), 50);
  const restoreView = () => { window.removeEventListener("afterprint", restoreView); restore ? go(restore) : renderHome(); };
  window.addEventListener("afterprint", restoreView);
});
$("#resetBtn").addEventListener("click", () => { if (confirm("진도·퀴즈·메모를 모두 지울까요?")) { state = {done:{}, checks:{}, quiz:{}, notes:{}, cur:null}; save(); renderHome(); closeRail(); } });
$("#fontBtn").addEventListener("click", () => {
  const root = document.documentElement; root.classList.toggle("large-text");
  try { localStorage.setItem(KEY + "-large", root.classList.contains("large-text") ? "1" : "0"); } catch(e){}
  $("#fontBtn").textContent = root.classList.contains("large-text") ? "글자 기본" : "글자 크게";
});
try { if (localStorage.getItem(KEY + "-large") === "1") { document.documentElement.classList.add("large-text"); $("#fontBtn").textContent = "글자 기본"; } } catch(e){}

$("#themeBtn").addEventListener("click", () => {
  const root = document.documentElement;
  const dark = root.dataset.theme ? root.dataset.theme === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
  root.dataset.theme = dark ? "light" : "dark";
  try { localStorage.setItem(KEY + "-theme", root.dataset.theme); } catch(e){}
});
try { const t = localStorage.getItem(KEY + "-theme"); if (t) document.documentElement.dataset.theme = t; } catch(e){}

state.cur ? go(state.cur) : renderHome();
</script>
</body>
</html>
