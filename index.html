<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>진로진학 상담 워크스테이션 — 창원경일고</title>
  <meta name="description" content="창원경일고 진로진학 상담 워크스테이션 — 학생 조회, 상담 도구, 업무별 자료실" />
  <link rel="stylesheet" href="common.css" />
  <link rel="manifest" href="manifest.json" />
  <link rel="apple-touch-icon" href="icon-192.png" />
  <meta name="theme-color" content="#1e3a5f" />
  <style>
    /* =====================================================
       v3 첫 화면 — 개인 업무용 작업대
       ① 학생 조회 + 자료 찾기 ② 상담 흐름 ③ 업무별 서랍 + 즐겨찾기 ④ 자료실
       ===================================================== */
    :root {
      --paper: #f3f5f8;
      --card: #ffffff;
      --card-2: #f7f9fc;
      --ink: #142033;
      --ink-2: #44526a;
      --ink-3: #6b778c;
      --line: #dfe5ee;
      --line-2: #c9d3e1;
      --brand: #1e3a5f;
      --brand-ink: #1e3a5f;
      --brand-soft: #e7eef8;
      --blue: #2563c9;
      --blue-soft: #e5eefc;
      --gold: #e5a300;
      --gold-soft: #fff5d9;
      --new: #c2410c;
      --new-soft: #fff1e7;
      --ok: #15803d;
      --shadow: 0 1px 2px rgba(16,32,60,.06), 0 6px 18px rgba(16,32,60,.06);
      --r: 14px;
      color-scheme: light;
    }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        --paper: #0f1622; --card: #172131; --card-2: #1c2839; --ink: #e8edf5; --ink-2: #b9c4d6; --ink-3: #8e9bb0;
        --line: #26344a; --line-2: #33445e; --brand-ink: #a9c6f0; --brand-soft: #1f3150; --blue: #7fb0ff; --blue-soft: #1d2f4d;
        --gold-soft: #3a2f10; --new: #ffad7a; --new-soft: #3b2417; --shadow: 0 1px 2px rgba(0,0,0,.3);
        --bg: #0f1622; --bg-card: #172131; --border: #26344a; --text-main: #e8edf5; --text-muted: #8e9bb0;
        color-scheme: dark;
      }
    }
    :root[data-theme="dark"] {
      --paper: #0f1622; --card: #172131; --card-2: #1c2839; --ink: #e8edf5; --ink-2: #b9c4d6; --ink-3: #8e9bb0;
      --line: #26344a; --line-2: #33445e; --brand-ink: #a9c6f0; --brand-soft: #1f3150; --blue: #7fb0ff; --blue-soft: #1d2f4d;
      --gold-soft: #3a2f10; --new: #ffad7a; --new-soft: #3b2417; --shadow: 0 1px 2px rgba(0,0,0,.3);
      color-scheme: dark;
    }
    body { background: var(--paper); color: var(--ink); word-break: keep-all; overflow-wrap: anywhere; }
    .wrap { max-width: 1200px; margin: 0 auto; padding: 0 20px; }
    .sr-only { position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap; }
    button, input, select { font-family: var(--font-main); }
    :focus-visible { outline: 3px solid rgba(37,99,201,.45); outline-offset: 2px; }

    /* ── ① 상단 작업 영역 ── */
    .top { background: var(--brand); color: #fff; padding: 22px 0 26px; position: relative; overflow: hidden; }
    .top::after { content:""; position:absolute; right:-80px; top:-120px; width:360px; height:360px; border-radius:50%;
      background: radial-gradient(circle, rgba(255,255,255,.10), rgba(255,255,255,0) 70%); pointer-events:none; }
    .top__head { display:flex; align-items:flex-end; gap:12px; flex-wrap:wrap; margin-bottom:16px; position:relative; z-index:1; }
    .top__school { font-size:12px; color:rgba(255,255,255,.7); letter-spacing:.3px; }
    .top__title { font-size:22px; font-weight:700; line-height:1.3; }
    .top__title b { color:#ffd166; font-weight:700; }
    .top__date { margin-left:auto; font-size:13px; color:rgba(255,255,255,.8); }
    .install-btn { display:none; align-items:center; gap:6px; background:rgba(255,255,255,.14); color:#fff;
      border:1px solid rgba(255,255,255,.3); padding:5px 11px; border-radius:999px; font-size:12px; font-weight:600; cursor:pointer; }
    .finders { display:grid; grid-template-columns: 1.1fr 1fr; gap:12px; position:relative; z-index:1; }
    .finder { background: rgba(255,255,255,.08); border:1px solid rgba(255,255,255,.18); border-radius:var(--r); padding:12px; }
    .finder__label { font-size:12px; font-weight:700; color:rgba(255,255,255,.85); margin-bottom:8px; display:flex; gap:6px; align-items:center; }
    .finder__row { display:flex; gap:8px; }
    .finder input { flex:1; min-width:0; height:44px; border:0; border-radius:10px; padding:0 14px; font-size:15px;
      background:#fff; color:#142033; }
    .finder input::placeholder { color:#8792a6; }
    .finder button.go { height:44px; padding:0 16px; border:0; border-radius:10px; background:#ffd166; color:#1b1b1b;
      font-weight:700; font-size:14px; cursor:pointer; white-space:nowrap; }
    .finder button.go:hover { background:#ffc53d; }
    .recent-students { display:flex; flex-wrap:wrap; gap:6px; margin-top:8px; min-height:0; }
    .recent-students button { background:rgba(255,255,255,.12); border:1px solid rgba(255,255,255,.2); color:#fff;
      border-radius:999px; padding:3px 10px; font-size:12px; cursor:pointer; }
    .recent-students button:hover { background:rgba(255,255,255,.22); }
    .find-hint { font-size:12px; color:rgba(255,255,255,.7); margin-top:8px; }
    .find-hint button { background:none; border:0; color:#ffd166; font-weight:700; cursor:pointer; padding:0 2px; font-size:12px; }

    .student-result { display:none; margin-top:12px; background:var(--card); color:var(--ink); border-radius:var(--r);
      padding:14px; box-shadow: var(--shadow); position:relative; z-index:1; }
    .student-result.open { display:block; }
    .student-result__who { font-weight:700; font-size:15px; color:var(--brand-ink); margin-bottom:10px; }
    .student-result__main { display:flex; justify-content:center; align-items:center; gap:8px; width:100%; padding:13px;
      border-radius:10px; background:var(--brand); color:#fff; font-weight:700; font-size:15px; text-decoration:none; }
    .student-result__main:hover { text-decoration:none; filter:brightness(1.1); }
    .student-result__more { display:grid; grid-template-columns:repeat(4,1fr); gap:8px; margin-top:8px; }
    .student-result__more a { display:flex; align-items:center; justify-content:center; gap:5px; padding:9px 6px; border-radius:10px;
      border:1px solid var(--line); background:var(--card-2); color:var(--ink-2); font-size:13px; font-weight:600; text-decoration:none; text-align:center; }
    .student-result__more a:hover { border-color:var(--blue); color:var(--blue); text-decoration:none; }

    /* ── 공통 블록 제목 ── */
    .block { margin-top:22px; }
    .block__head { display:flex; align-items:baseline; gap:8px; margin-bottom:10px; }
    .block__title { font-size:16px; font-weight:700; color:var(--ink); }
    .block__sub { font-size:12px; color:var(--ink-3); }
    .block__head .link-btn { margin-left:auto; background:none; border:0; color:var(--blue); font-size:12px; font-weight:700; cursor:pointer; }

    /* ── ② 상담 흐름 ── */
    .flow { display:grid; grid-template-columns:repeat(5,1fr); gap:10px; counter-reset: step; }
    .flow a { position:relative; display:flex; flex-direction:column; gap:3px; background:var(--card); border:1px solid var(--line);
      border-radius:var(--r); padding:14px 14px 13px; text-decoration:none; color:var(--ink); box-shadow:var(--shadow); min-width:0; }
    .flow a:hover { border-color:var(--blue); text-decoration:none; transform:translateY(-1px); }
    .flow__n { font-size:11px; font-weight:800; color:var(--blue); letter-spacing:.3px; }
    .flow__t { font-size:15px; font-weight:700; display:flex; gap:6px; align-items:center; }
    .flow__d { font-size:12px; color:var(--ink-3); line-height:1.45; }
    .flow a:not(:last-child)::after { content:"›"; position:absolute; right:-9px; top:50%; transform:translateY(-50%);
      width:16px; height:16px; display:grid; place-items:center; font-size:15px; color:var(--ink-3); background:var(--paper); border-radius:50%; z-index:1; }

    /* ── ③ 업무별 서랍 + 즐겨찾기 ── */
    .desk { display:grid; grid-template-columns: minmax(0,1.65fr) minmax(0,1fr); gap:18px; align-items:start; }
    .desk > * { min-width:0; }
    .drawers { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:10px; }
    .drawer { width:100%; text-align:left; background:var(--card); border:1px solid var(--line); border-radius:var(--r); padding:12px 13px;
      cursor:pointer; display:flex; flex-direction:column; gap:4px; min-width:0; color:var(--ink); }
    .drawer:hover { border-color:var(--blue); background:var(--card-2); }
    .drawer__top { display:flex; align-items:center; gap:8px; }
    .drawer__icon { font-size:20px; line-height:1; }
    .drawer__name { font-size:14px; font-weight:700; flex:1; min-width:0; line-height:1.35; }
    .drawer__count { font-size:12px; font-weight:800; color:var(--blue); background:var(--blue-soft); border-radius:999px; padding:1px 8px; }
    .drawer__groups { font-size:11.5px; color:var(--ink-3); line-height:1.45; }
    .drawer--personal { border-style:dashed; }

    .side { display:flex; flex-direction:column; gap:12px; }
    .panel { background:var(--card); border:1px solid var(--line); border-radius:var(--r); padding:12px; }
    .panel__head { display:flex; align-items:center; gap:6px; font-size:13px; font-weight:700; margin-bottom:8px; color:var(--ink); }
    .panel__head small { font-weight:400; color:var(--ink-3); font-size:11.5px; }
    .pin-list { display:flex; flex-direction:column; gap:4px; }
    .pin { display:flex; align-items:center; gap:8px; width:100%; text-align:left; background:none; border:0; border-radius:8px;
      padding:7px 8px; cursor:pointer; color:var(--ink); font-size:13px; }
    .pin:hover { background:var(--card-2); }
    .pin__icon { width:22px; text-align:center; flex-shrink:0; }
    .pin__title { flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    .pin__sec { font-size:11px; color:var(--ink-3); flex-shrink:0; }
    .panel-empty { font-size:12px; color:var(--ink-3); line-height:1.6; padding:2px 4px; }
    .tabs { display:flex; gap:4px; margin-bottom:8px; background:var(--card-2); padding:3px; border-radius:10px; }
    .tabs button { flex:1; border:0; background:none; padding:6px; border-radius:8px; font-size:12px; font-weight:700; color:var(--ink-3); cursor:pointer; }
    .tabs button[aria-selected="true"] { background:var(--card); color:var(--ink); box-shadow:var(--shadow); }
    .ext-links { display:flex; flex-wrap:wrap; gap:6px; }
    .ext-links a { display:inline-flex; gap:5px; align-items:center; padding:5px 10px; border:1px solid var(--line); border-radius:999px;
      font-size:12px; font-weight:600; color:var(--ink-2); text-decoration:none; background:var(--card-2); }
    .ext-links a:hover { border-color:var(--blue); color:var(--blue); text-decoration:none; }

    /* ── ④ 자료실 ── */
    .archive { margin-top:28px; scroll-margin-top:64px; }
    .toolbar { position:sticky; top:var(--nav-height,56px); z-index:50; background:var(--paper); padding:10px 0 8px;
      border-bottom:1px solid var(--line); margin-bottom:12px; }
    .toolbar__row { display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
    .toolbar__row + .toolbar__row { margin-top:8px; }
    .search { position:relative; flex:1 1 280px; min-width:0; }
    .search input { width:100%; height:42px; border:1px solid var(--line-2); border-radius:10px; padding:0 38px 0 36px;
      font-size:14px; background:var(--card); color:var(--ink); }
    .search input:focus { outline:none; border-color:var(--blue); box-shadow:0 0 0 3px rgba(37,99,201,.15); }
    .search__icon { position:absolute; left:12px; top:50%; transform:translateY(-50%); font-size:14px; pointer-events:none; }
    .search__clear { position:absolute; right:6px; top:50%; transform:translateY(-50%); border:0; background:none; font-size:20px;
      color:var(--ink-3); cursor:pointer; width:30px; height:30px; display:none; }
    .search.has-q .search__clear { display:block; }
    .select { height:42px; border:1px solid var(--line-2); border-radius:10px; padding:0 10px; font-size:13px; background:var(--card); color:var(--ink); }
    .chips { display:flex; gap:6px; overflow-x:auto; scrollbar-width:none; -webkit-overflow-scrolling:touch; flex:1; min-width:0; padding-bottom:1px; }
    .chips::-webkit-scrollbar { display:none; }
    .chip { flex-shrink:0; border:1px solid var(--line); background:var(--card); color:var(--ink-2); border-radius:999px;
      padding:6px 12px; font-size:12.5px; font-weight:600; cursor:pointer; white-space:nowrap; }
    .chip:hover { border-color:var(--blue); color:var(--blue); }
    .chip[aria-pressed="true"] { background:var(--brand); border-color:var(--brand); color:#fff; }
    .result-line { font-size:12px; color:var(--ink-3); display:flex; gap:10px; align-items:center; flex-wrap:wrap; }
    .result-line b { color:var(--ink); }
    .result-line .tbtn { border:0; background:none; color:var(--blue); font-weight:700; font-size:12px; cursor:pointer; padding:2px; }

    .sec { background:var(--card); border:1px solid var(--line); border-radius:var(--r); margin-bottom:10px; overflow:hidden; scroll-margin-top:170px; }
    .sec__head { width:100%; display:flex; align-items:center; gap:10px; padding:13px 14px; border:0; background:none; cursor:pointer; text-align:left; color:var(--ink); }
    .sec__head:hover { background:var(--card-2); }
    .sec__icon { font-size:22px; line-height:1; flex-shrink:0; }
    .sec__titles { flex:1; min-width:0; }
    .sec__name { font-size:15px; font-weight:700; }
    .sec__desc { font-size:12px; color:var(--ink-3); margin-top:1px; }
    .sec__count { font-size:12px; font-weight:800; color:var(--blue); background:var(--blue-soft); border-radius:999px; padding:2px 9px; flex-shrink:0; }
    .sec__chev { color:var(--ink-3); transition:transform .15s; flex-shrink:0; }
    .sec.open .sec__chev { transform:rotate(180deg); }
    .sec__body { display:none; padding:2px 14px 14px; }
    .sec.open .sec__body { display:block; }
    .grp + .grp { margin-top:14px; }
    .grp__title { font-size:12px; font-weight:800; color:var(--ink-3); letter-spacing:.2px; margin:4px 0 8px; display:flex; align-items:center; gap:8px; }
    .grp__title::after { content:""; flex:1; height:1px; background:var(--line); }
    .cards { display:grid; grid-template-columns:repeat(auto-fill,minmax(270px,1fr)); gap:10px; }

    .card { position:relative; display:flex; gap:11px; background:var(--card); border:1px solid var(--line); border-radius:12px;
      padding:12px 44px 11px 12px; cursor:pointer; min-width:0; transition:border-color .12s, box-shadow .12s; }
    .card:hover { border-color:var(--blue); box-shadow:var(--shadow); }
    .card.hit { border-color:#f0c35a; }
    .card__icon { font-size:22px; line-height:1.2; flex-shrink:0; }
    .card__body { min-width:0; flex:1; }
    .card__title { font-size:14px; font-weight:700; color:var(--brand-ink); line-height:1.4;
      display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
    .card__desc { font-size:12.5px; color:var(--ink-2); line-height:1.5; margin-top:3px;
      display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
    .card__meta { display:flex; flex-wrap:wrap; gap:4px; margin-top:7px; }
    .m { font-size:10.5px; font-weight:700; padding:2px 7px; border-radius:999px; background:var(--card-2); color:var(--ink-3); border:1px solid var(--line); }
    .m--new { background:var(--new-soft); color:var(--new); border-color:transparent; }
    .m--feat { background:var(--blue-soft); color:var(--blue); border-color:transparent; }
    .m--by { background:var(--gold-soft); color:#8a5b00; border-color:transparent; }
    :root[data-theme="dark"] .m--by { color:#ffd27a; }
    @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .m--by { color:#ffd27a; } }
    .m--ai { background:#ecfdf3; color:#067647; border-color:transparent; }
    :root[data-theme="dark"] .m--ai { background:#12321f; color:#7ee2a8; }
    @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .m--ai { background:#12321f; color:#7ee2a8; } }
    .card__links { display:flex; flex-wrap:wrap; gap:6px; margin-top:8px; }
    .card__links button { border:1px solid var(--line-2); background:var(--card-2); color:var(--ink-2); border-radius:8px; padding:4px 9px; font-size:12px; font-weight:600; cursor:pointer; }
    .card__links button:hover { border-color:var(--blue); color:var(--blue); }
    .fav { position:absolute; right:8px; top:8px; width:32px; height:32px; border-radius:50%; border:1px solid var(--line); background:var(--card);
      color:#9aa6b8; font-size:16px; cursor:pointer; display:grid; place-items:center; line-height:1; }
    .fav:hover { color:var(--gold); border-color:var(--gold); }
    .fav.on { color:var(--gold); background:var(--gold-soft); border-color:#f3cf6a; }
    .no-result { display:none; text-align:center; padding:36px 16px; color:var(--ink-3); font-size:14px; background:var(--card); border:1px dashed var(--line-2); border-radius:var(--r); }
    .no-result.show { display:block; }

    .theme-btn { position:fixed; right:14px; bottom:14px; z-index:60; width:42px; height:42px; border-radius:50%; border:1px solid var(--line-2);
      background:var(--card); color:var(--ink); box-shadow:var(--shadow); cursor:pointer; font-size:18px; }
    .to-top { position:fixed; right:14px; bottom:64px; z-index:60; width:42px; height:42px; border-radius:50%; border:1px solid var(--line-2);
      background:var(--card); color:var(--ink); box-shadow:var(--shadow); cursor:pointer; font-size:16px; display:none; }
    .to-top.show { display:block; }
    .ws-footer { margin-top:40px; }

    /* ── 반응형 ── */
    @media (max-width: 1080px) {
      .flow { grid-template-columns:repeat(3,1fr); }
      .flow a:not(:last-child)::after { display:none; }
      .drawers { grid-template-columns:repeat(2,minmax(0,1fr)); }
    }
    @media (max-width: 860px) {
      .finders { grid-template-columns:1fr; }
      .desk { grid-template-columns:1fr; }
      .side { order:-1; }
    }
    @media (max-width: 600px) {
      .wrap { padding:0 16px; }
      .top { padding:16px 0 18px; }
      .top__title { font-size:19px; }
      .top__date { margin-left:0; width:100%; font-size:12px; }
      .student-result__more { grid-template-columns:repeat(2,1fr); }
      .flow { grid-template-columns:repeat(2,1fr); gap:8px; }
      .flow a { padding:11px 12px; }
      .flow a:last-child:nth-child(odd) { grid-column:span 2; }
      .flow__d { display:none; }
      .desk__drawers { display:none; }  /* 휴대폰은 아래 자료실 목록이 같은 역할 */
      .drawer { padding:10px 11px; }
      .drawer__groups { display:none; }
      .drawer__name { font-size:13px; }
      .toolbar { position:static; }
      .toolbar__row--opts { display:grid; grid-template-columns:1fr 1fr; }
      .toolbar__row--opts .select { width:100%; min-width:0; }
      .toolbar__row--opts .result-line { grid-column:1 / -1; }
      .pin-list .pin:nth-of-type(n+7) { display:none; }
      .cards { grid-template-columns:1fr; }
      .sec__desc { display:none; }
      .sec { scroll-margin-top:70px; }
      .archive { scroll-margin-top:60px; }
    }
  </style>
</head>
<body data-ws-page="home">

  <!-- ① 학생 조회 + 자료 찾기 -->
  <header class="top" id="hero">
    <div class="wrap">
      <div class="top__head">
        <div>
          <div class="top__school">창원경일고등학교 · 진로진학상담부</div>
          <h1 class="top__title">진로진학 <b>상담 워크스테이션</b></h1>
        </div>
        <div class="top__date" id="todayStr"></div>
        <button class="install-btn" id="pwaInstallBtn" type="button">⬇️ 앱으로 설치</button>
      </div>

      <div class="finders">
        <form class="finder" id="studentForm" autocomplete="off">
          <label class="finder__label" for="studentSearchInput">👤 학생 조회 <span style="font-weight:400;opacity:.75">학번 5자리 또는 이름</span></label>
          <div class="finder__row">
            <input type="text" id="studentSearchInput" placeholder="예: 20315 또는 김○○" />
            <button class="go" type="submit">조회</button>
          </div>
          <div class="recent-students" id="recentStudents"></div>
        </form>
        <form class="finder" id="toolForm" autocomplete="off">
          <label class="finder__label" for="toolSearchInput">🔎 도구·자료 찾기 <span style="font-weight:400;opacity:.75" id="toolCountLabel"></span></label>
          <div class="finder__row">
            <input type="search" id="toolSearchInput" placeholder="예: 수능최저, 면접, 배치표, 박상근" />
            <button class="go" type="submit">찾기</button>
          </div>
          <div class="find-hint">자주 찾는 말:
            <button type="button" data-q="수능최저">수능최저</button>
            <button type="button" data-q="배치">배치</button>
            <button type="button" data-q="세특">세특</button>
            <button type="button" data-q="면접">면접</button>
            <button type="button" data-q="GPTs">GPTs</button>
          </div>
        </form>
      </div>

      <div class="student-result" id="studentResult" aria-live="polite">
        <div class="student-result__who" id="studentResultName"></div>
        <a class="student-result__main" id="studentMain" target="_blank" rel="noopener">💬 상담기록 확인 · 상담 시작 ↗</a>
        <div class="student-result__more" id="studentMore"></div>
      </div>
    </div>
  </header>

  <main class="wrap">
    <!-- ② 상담 흐름 -->
    <section class="block" aria-labelledby="flowTitle">
      <div class="block__head">
        <h2 class="block__title" id="flowTitle">상담 흐름</h2>
        <span class="block__sub">학생 조회 뒤 이 순서로 열면 됩니다</span>
      </div>
      <nav class="flow" aria-label="상담 도구">
        <a href="https://mathlhk15-glitch.github.io/jinlosangdam/" target="_blank" rel="noopener">
          <span class="flow__n">1 · 기록</span><span class="flow__t">💬 상담관리</span><span class="flow__d">예약·상담 진행·이력</span></a>
        <a href="https://mathlhk15-glitch.github.io/2026gumsa-R/" target="_blank" rel="noopener">
          <span class="flow__n">2 · 검사</span><span class="flow__t">📊 검사결과</span><span class="flow__d">인성·적성·진로·자기주도</span></a>
        <a href="https://mathlhk15-glitch.github.io/susi/" target="_blank" rel="noopener">
          <span class="flow__n">3 · 학생부</span><span class="flow__t">📋 생기부 분석</span><span class="flow__d">PDF 분석·세특 키워드</span></a>
        <a href="https://mathlhk15-glitch.github.io/ipsi/" target="_blank" rel="noopener">
          <span class="flow__n">4 · 진학</span><span class="flow__t">🐼 진학 Navigator</span><span class="flow__d">성적·입결·학과 비교</span></a>
        <a href="report.html" target="_blank" rel="noopener">
          <span class="flow__n">5 · 정리</span><span class="flow__t">🧾 통합리포트</span><span class="flow__d">상담 결과 한 장 정리</span></a>
      </nav>
    </section>

    <!-- ③ 업무별 서랍 + 즐겨찾기 -->
    <section class="block desk">
      <div class="desk__drawers">
        <div class="block__head">
          <h2 class="block__title">업무별 자료실</h2>
          <span class="block__sub">누르면 그 분류만 펼쳐집니다</span>
        </div>
        <div class="drawers" id="drawers"></div>

      <aside class="side">
        <div class="panel">
          <div class="tabs" role="tablist">
            <button role="tab" id="tabFav" aria-selected="true" data-pane="fav">⭐ 즐겨찾기</button>
            <button role="tab" id="tabRecent" aria-selected="false" data-pane="recent">🕘 최근 본</button>
          </div>
          <div class="pin-list" id="pinList"></div>
        </div>
        <div class="panel">
          <div class="panel__head">🌐 외부 사이트 <small>공식 정보</small></div>
          <div class="ext-links" id="extLinks"></div>
        </div>
      </aside>
    </section>

    <!-- ④ 자료실 -->
    <section class="archive" id="archive" aria-labelledby="archiveTitle">
      <h2 class="sr-only" id="archiveTitle">자료실</h2>
      <div class="toolbar">
        <div class="toolbar__row">
          <div class="search" id="searchBox">
            <span class="search__icon">🔍</span>
            <input type="search" id="archiveSearchInput" placeholder="자료명·설명·태그·제작자 검색" aria-label="자료 검색" />
            <button class="search__clear" type="button" id="searchClear" aria-label="검색어 지우기">×</button>
          </div>
        </div>
        <div class="toolbar__row">
          <div class="chips" id="secChips" aria-label="분류"></div>
        </div>
        <div class="toolbar__row toolbar__row--opts">
          <select class="select" id="viewSelect" aria-label="보기">
            <option value="all">전체 보기</option>
            <option value="featured">📌 업무 핵심 추천</option>
            <option value="new">🆕 최근 업데이트</option>
            <option value="favorites">⭐ 즐겨찾기</option>
            <option value="recent">🕘 최근 본</option>
            <option value="external">🤝 외부 제작</option>
            <option value="ai">🤖 GPTs·Gemini</option>
          </select>
          <select class="select" id="sortSelect" aria-label="정렬">
            <option value="group">묶음순</option>
            <option value="latest">최신순</option>
            <option value="title">가나다순</option>
          </select>
          <div class="result-line"><span id="resultCount"></span>
            <button class="tbtn" type="button" id="expandAll">모두 펼치기</button>
            <button class="tbtn" type="button" id="collapseAll">모두 접기</button>
          </div>
        </div>
      </div>
      <div id="archiveSections"></div>
      <div class="no-result" id="archiveNoResult"></div>
    </section>
  </main>

  <button class="to-top" id="toTop" type="button" aria-label="맨 위로">↑</button>
  <button class="theme-btn" id="themeBtn" type="button" aria-label="화면 밝기 바꾸기">🌓</button>

  <script src="nav.js"></script>
  <script src="data.js"></script>
  <script>
  (function () {
    'use strict';
    const $ = id => document.getElementById(id);
    const esc = v => String(v ?? '').replace(/[&<>'"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[c]));
    const store = {
      get(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch { return d; } },
      set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} }
    };
    // 기존 저장 키 그대로 사용 (즐겨찾기·최근 본 자료·최근 학생 유지)
    const FAV_KEY = 'lhk15_archive_favorites_v1', RECENT_KEY = 'lhk15_archive_recent_v1', STU_KEY = 'ws_recent_students';
    const OPEN_KEY = 'lhk15_archive_open_v1', THEME_KEY = 'lhk15_theme';
    const SEC_IDS = Object.keys(SECTIONS);
    const secIcon = sid => (SECTIONS[sid].label.match(/^\S+/) || ['📁'])[0];
    const secName = sid => SECTIONS[sid].label.replace(/^\S+\s/, '');
    const byId = Object.fromEntries(resources.map(r => [r.id, r]));
    const AI_PLATFORMS = { gpt: 'GPTs', gemini: 'Gemini', claude: 'Claude' };
    const isAI = r => (r.links || []).some(l => AI_PLATFORMS[l.platform]);

    /* ── 테마 ── */
    const applyTheme = t => { if (t) document.documentElement.dataset.theme = t; else delete document.documentElement.dataset.theme; };
    applyTheme(store.get(THEME_KEY, ''));
    $('themeBtn').addEventListener('click', () => {
      const dark = document.documentElement.dataset.theme ? document.documentElement.dataset.theme === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
      const next = dark ? 'light' : 'dark'; applyTheme(next); store.set(THEME_KEY, next);
    });

    /* ── 날짜 ── */
    const now = new Date();
    $('todayStr').textContent = `${now.getFullYear()}년 ${now.getMonth() + 1}월 ${now.getDate()}일 (${'일월화수목금토'[now.getDay()]})`;
    $('toolCountLabel').textContent = `${resources.length}개 중`;

    /* ── 학생 조회 ── */
    const decodeSafe = s => { try { return decodeURIComponent(s); } catch { return s; } };
    const getStudents = () => store.get(STU_KEY, []).filter(s => s && s.id).map(s => ({ ...s, id: decodeSafe(String(s.id)), name: String(s.name || s.id) }));
    function renderStudents() {
      const list = getStudents().slice(0, 5);
      $('recentStudents').innerHTML = list.length
        ? list.map(s => `<button type="button" data-stu="${esc(s.id)}">${esc(s.name)}</button>`).join('')
        : '';
    }
    function searchStudent(q) {
      q = (q ?? $('studentSearchInput').value).trim();
      if (!q) { $('studentSearchInput').focus(); return; }
      $('studentSearchInput').value = q;
      const isId = /^\d{5}$/.test(q);
      const p = new URLSearchParams(); p.set(isId ? 'studentId' : 'name', q);
      const qs = p.toString();
      $('studentResultName').textContent = `🔍 ${isId ? '학번 ' + q : '이름 “' + q + '”'} 으로 조회`;
      $('studentMain').href = `https://mathlhk15-glitch.github.io/jinlosangdam/?${qs}`;
      $('studentMore').innerHTML = [
        ['📊 검사결과', `https://mathlhk15-glitch.github.io/2026gumsa-R/?${qs}`],
        ['📋 생기부 분석', `https://mathlhk15-glitch.github.io/susi/?${qs}`],
        ['🐼 진학 Navigator', 'https://mathlhk15-glitch.github.io/ipsi/'],
        ['🧾 통합리포트', `report.html?${qs}`]
      ].map(([t, u]) => `<a href="${esc(u)}" target="_blank" rel="noopener">${t} ↗</a>`).join('');
      $('studentResult').classList.add('open');
      let list = getStudents().filter(s => s.id !== q);
      list.unshift({ id: q, name: q, ts: Date.now() });
      store.set(STU_KEY, list.slice(0, 5));
      renderStudents();
    }
    $('studentForm').addEventListener('submit', e => { e.preventDefault(); searchStudent(); });
    $('recentStudents').addEventListener('click', e => { const b = e.target.closest('[data-stu]'); if (b) searchStudent(b.dataset.stu); });
    window.searchStudent = () => searchStudent();
    renderStudents();

    /* ── 자료실 상태 ── */
    const state = { q: '', sec: 'all', view: 'all', sort: 'group', open: new Set(store.get(OPEN_KEY, [])) };
    const getFav = () => new Set(store.get(FAV_KEY, []));
    const getRecent = () => store.get(RECENT_KEY, []).filter(id => byId[id]);
    function openResource(id, linkIdx = 0) {
      const r = byId[id]; if (!r || !r.links || !r.links[linkIdx]) return;
      store.set(RECENT_KEY, [id, ...getRecent().filter(x => x !== id)].slice(0, 10));
      window.open(r.links[linkIdx].url, '_blank', 'noopener,noreferrer');
      renderPins();
    }
    function toggleFav(id) {
      const f = getFav(); f.has(id) ? f.delete(id) : f.add(id);
      store.set(FAV_KEY, [...f]); renderPins(); renderArchive();
    }
    const dateVal = s => { const m = String(s || '').match(/(\d{4})[-.](\d{1,2})/); return m ? +m[1] * 100 + +m[2] : 0; };
    const groupIdx = r => { const g = (SECTIONS[r.section].groups || []).findIndex(x => x.id === r.group); return g < 0 ? 999 : g; };
    function sortItems(items) {
      const a = items.slice();
      if (state.sort === 'title') return a.sort((x, y) => x.title.localeCompare(y.title, 'ko'));
      if (state.sort === 'latest') return a.sort((x, y) => dateVal(y.updatedAt) - dateVal(x.updatedAt) || x.title.localeCompare(y.title, 'ko'));
      return a.sort((x, y) => groupIdx(x) - groupIdx(y) || (x.order || 99) - (y.order || 99) || (+!!y.featured - +!!x.featured) || dateVal(y.updatedAt) - dateVal(x.updatedAt));
    }
    function matches(r, fav, recent) {
      if (state.sec !== 'all' && r.section !== state.sec) return false;
      if (state.view === 'featured' && !r.featured) return false;
      if (state.view === 'new' && !r.isNew) return false;
      if (state.view === 'favorites' && !fav.has(r.id)) return false;
      if (state.view === 'recent' && !recent.includes(r.id)) return false;
      if (state.view === 'external' && !r.by) return false;
      if (state.view === 'ai' && !isAI(r)) return false;
      if (!state.q) return true;
      const g = (SECTIONS[r.section].groups || []).find(x => x.id === r.group);
      const hay = [r.title, r.description, r.by, ...(r.tags || []), SECTIONS[r.section].label, g && g.label,
        ...(r.links || []).map(l => AI_PLATFORMS[l.platform] || '')].join(' ').toLowerCase();
      return state.q.toLowerCase().split(/\s+/).filter(Boolean).every(w => hay.includes(w));
    }

    function cardHtml(r, fav, hit) {
      const meta = [`<span class="m">${esc(r.updatedAt || '날짜 미상')}</span>`];
      if (r.featured) meta.push('<span class="m m--feat">추천</span>');
      if (r.isNew) meta.push('<span class="m m--new">NEW</span>');
      if (r.by) meta.push(`<span class="m m--by">외부 · ${esc(r.by)}</span>`);
      const ai = [...new Set((r.links || []).map(l => AI_PLATFORMS[l.platform]).filter(Boolean))];
      if (ai.length) meta.push(`<span class="m m--ai">${esc(ai.join('·'))}</span>`);
      const extra = (r.links || []).length > 1
        ? `<div class="card__links">${r.links.map((l, i) => `<button type="button" data-open="${esc(r.id)}" data-link="${i}">${esc(l.label)} ↗</button>`).join('')}</div>` : '';
      const on = fav.has(r.id);
      return `<div class="card${hit ? ' hit' : ''}" role="link" tabindex="0" data-open="${esc(r.id)}" title="새 창에서 열기">
        <span class="card__icon" aria-hidden="true">${esc(r.icon || '📄')}</span>
        <div class="card__body"><div class="card__title">${esc(r.title)}</div>
          <div class="card__desc">${esc(r.description || '')}</div>
          <div class="card__meta">${meta.join('')}</div>${extra}</div>
        <button type="button" class="fav${on ? ' on' : ''}" data-fav="${esc(r.id)}" aria-pressed="${on}" aria-label="즐겨찾기 ${on ? '해제' : '추가'}">${on ? '★' : '☆'}</button>
      </div>`;
    }

    function renderArchive() {
      const fav = getFav(), recent = getRecent();
      const matched = resources.filter(r => matches(r, fav, recent));
      const searching = !!state.q;
      const filtered = searching || state.view !== 'all' || state.sec !== 'all';
      let html = '';
      SEC_IDS.forEach(sid => {
        const items = sortItems(matched.filter(r => r.section === sid));
        if (!items.length) return;
        const open = filtered || state.open.has(sid);
        let body = '';
        if (state.sort === 'group' && (SECTIONS[sid].groups || []).length) {
          const groups = [...(SECTIONS[sid].groups || []), { id: '__etc', label: '기타' }];
          groups.forEach(g => {
            const gi = items.filter(r => g.id === '__etc' ? !(SECTIONS[sid].groups || []).some(x => x.id === r.group) : r.group === g.id);
            if (!gi.length) return;
            body += `<div class="grp"><div class="grp__title">${esc(g.label)} · ${gi.length}</div><div class="cards">${gi.map(r => cardHtml(r, fav, searching)).join('')}</div></div>`;
          });
        } else {
          body = `<div class="cards">${items.map(r => cardHtml(r, fav, searching)).join('')}</div>`;
        }
        html += `<section class="sec${open ? ' open' : ''}" id="sec-${sid}" data-sec="${sid}">
          <button type="button" class="sec__head" data-toggle="${sid}" aria-expanded="${open}">
            <span class="sec__icon" aria-hidden="true">${esc(secIcon(sid))}</span>
            <span class="sec__titles"><span class="sec__name">${esc(secName(sid))}</span><div class="sec__desc">${esc(SECTIONS[sid].desc || '')}</div></span>
            <span class="sec__count">${items.length}</span><span class="sec__chev" aria-hidden="true">▼</span>
          </button>
          <div class="sec__body">${body}</div></section>`;
      });
      $('archiveSections').innerHTML = html;
      const nr = $('archiveNoResult');
      nr.classList.toggle('show', !matched.length);
      nr.textContent = state.view === 'favorites' ? '즐겨찾기한 자료가 없습니다. 카드 오른쪽 위 ☆를 누르면 여기와 첫 화면에 모입니다.'
        : state.view === 'recent' ? '최근 본 자료가 없습니다.' : '찾는 자료가 없습니다. 다른 말이나 분류로 찾아보세요.';
      $('resultCount').innerHTML = `<b>${matched.length}</b>개 / 전체 ${resources.length}개`;
      $('searchBox').classList.toggle('has-q', !!state.q);
    }

    function renderChips() {
      const count = sid => resources.filter(r => r.section === sid).length;
      $('secChips').innerHTML = [`<button class="chip" data-sec="all" aria-pressed="${state.sec === 'all'}">전체 ${resources.length}</button>`]
        .concat(SEC_IDS.map(sid => `<button class="chip" data-sec="${sid}" aria-pressed="${state.sec === sid}">${esc(secIcon(sid))} ${esc(secName(sid))} ${count(sid)}</button>`)).join('');
    }
    function renderDrawers() {
      $('drawers').innerHTML = SEC_IDS.map(sid => {
        const n = resources.filter(r => r.section === sid).length;
        const gs = (SECTIONS[sid].groups || []).map(g => g.label).join(' · ');
        return `<button type="button" class="drawer${sid === 'personal' ? ' drawer--personal' : ''}" data-sec="${sid}">
          <span class="drawer__top"><span class="drawer__icon" aria-hidden="true">${esc(secIcon(sid))}</span><span class="drawer__name">${esc(secName(sid))}</span><span class="drawer__count">${n}</span></span>
          <span class="drawer__groups">${esc(gs || SECTIONS[sid].desc || '')}</span></button>`;
      }).join('');
    }
    let pane = 'fav';
    function renderPins() {
      const fav = [...getFav()].filter(id => byId[id]);
      let ids, empty;
      if (pane === 'fav') {
        ids = fav.length ? fav : resources.filter(r => r.featured).map(r => r.id);
        empty = '';
      } else { ids = getRecent(); empty = '아직 연 자료가 없습니다.'; }
      const head = pane === 'fav' && !fav.length ? '<div class="panel-empty">즐겨찾기가 없어 업무 핵심 추천을 보여 줍니다. 카드의 ☆로 고정하세요.</div>' : '';
      $('pinList').innerHTML = head + (ids.length ? ids.slice(0, 12).map(id => { const r = byId[id];
        return `<button type="button" class="pin" data-open="${esc(id)}"><span class="pin__icon">${esc(r.icon || '📄')}</span><span class="pin__title">${esc(r.title)}</span><span class="pin__sec">${esc(secIcon(r.section))}</span></button>`; }).join('')
        : `<div class="panel-empty">${empty}</div>`);
      $('tabFav').textContent = `⭐ 즐겨찾기${fav.length ? ' ' + fav.length : ''}`;
    }
    document.querySelectorAll('.tabs [role=tab]').forEach(b => b.addEventListener('click', () => {
      pane = b.dataset.pane; document.querySelectorAll('.tabs [role=tab]').forEach(x => x.setAttribute('aria-selected', x === b)); renderPins();
    }));

    const EXT = [
      ['🏫', '대학어디가', 'https://www.adiga.kr'], ['📊', '대학알리미', 'https://www.academyinfo.go.kr'],
      ['🧭', '커리어넷', 'https://www.career.go.kr/'], ['💼', '고용24', 'https://www.work24.go.kr/'],
      ['✨', '꿈길', 'https://www.ggoomgil.go.kr/'], ['📚', '입시자료모음', 'https://xn--vk1bt41a12ci0t.com/univ-admission-search/']
    ];
    $('extLinks').innerHTML = EXT.map(([i, t, u]) => `<a href="${u}" target="_blank" rel="noopener">${i} ${t}</a>`).join('');

    /* ── 동작 ── */
    function goArchive(focusSec) {
      const el = focusSec ? $('sec-' + focusSec) : $('archive');
      (el || $('archive')).scrollIntoView({ behavior: 'smooth', block: 'start' });
    }
    function setSec(sid, scroll) {
      state.sec = sid; renderChips(); renderArchive();
      const chip = document.querySelector(`.chip[data-sec="${sid}"]`); if (chip) chip.scrollIntoView({ block: 'nearest', inline: 'center' });
      if (scroll) goArchive();
    }
    function setQuery(q, scroll) {
      state.q = q.trim(); $('archiveSearchInput').value = state.q; $('toolSearchInput').value = state.q;
      if (state.q) { state.sec = 'all'; renderChips(); }
      renderArchive(); if (scroll) goArchive();
    }
    let t;
    $('archiveSearchInput').addEventListener('input', e => { clearTimeout(t); t = setTimeout(() => setQuery(e.target.value), 120); });
    $('searchClear').addEventListener('click', () => { setQuery(''); $('archiveSearchInput').focus(); });
    $('toolForm').addEventListener('submit', e => { e.preventDefault(); setQuery($('toolSearchInput').value, true); });
    document.querySelectorAll('.find-hint [data-q]').forEach(b => b.addEventListener('click', () => setQuery(b.dataset.q, true)));
    $('secChips').addEventListener('click', e => { const b = e.target.closest('[data-sec]'); if (b) setSec(b.dataset.sec); });
    $('drawers').addEventListener('click', e => { const b = e.target.closest('[data-sec]'); if (b) { state.q = ''; $('archiveSearchInput').value = ''; setSec(b.dataset.sec, true); } });
    $('viewSelect').addEventListener('change', e => { state.view = e.target.value; renderArchive(); });
    $('sortSelect').addEventListener('change', e => { state.sort = e.target.value; renderArchive(); });
    $('expandAll').addEventListener('click', () => { state.open = new Set(SEC_IDS); store.set(OPEN_KEY, [...state.open]); renderArchive(); });
    $('collapseAll').addEventListener('click', () => { state.open = new Set(); store.set(OPEN_KEY, []); state.sec = 'all'; state.view = 'all'; state.q = '';
      $('viewSelect').value = 'all'; $('archiveSearchInput').value = ''; $('toolSearchInput').value = ''; renderChips(); renderArchive(); });
    document.addEventListener('click', e => {
      const fav = e.target.closest('[data-fav]'); if (fav) { e.stopPropagation(); toggleFav(fav.dataset.fav); return; }
      const tg = e.target.closest('[data-toggle]');
      if (tg) { const sid = tg.dataset.toggle; const sec = tg.closest('.sec'); const willOpen = !sec.classList.contains('open');
        sec.classList.toggle('open', willOpen); tg.setAttribute('aria-expanded', willOpen);
        willOpen ? state.open.add(sid) : state.open.delete(sid); store.set(OPEN_KEY, [...state.open]); return; }
      const op = e.target.closest('[data-open]'); if (op) openResource(op.dataset.open, +(op.dataset.link || 0));
    });
    document.addEventListener('keydown', e => {
      if (e.key === 'Enter' && e.target.matches && e.target.matches('.card[data-open]')) openResource(e.target.dataset.open);
      if (e.key === '/' && !/input|textarea|select/i.test(document.activeElement.tagName)) { e.preventDefault(); $('toolSearchInput').focus(); }
    });
    addEventListener('scroll', () => $('toTop').classList.toggle('show', scrollY > 700), { passive: true });
    $('toTop').addEventListener('click', () => scrollTo({ top: 0, behavior: 'smooth' }));

    renderChips(); renderDrawers(); renderPins(); renderArchive();
    function onHash() {
      const h = decodeURIComponent(location.hash.slice(1));
      if (h.startsWith('sec-') && SECTIONS[h.slice(4)]) setSec(h.slice(4), true);
      else if (h === 'archive') setTimeout(() => goArchive(), 50);
    }
    onHash(); addEventListener('hashchange', onHash);
  })();
  </script>

  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => { navigator.serviceWorker.register('./sw.js').catch(() => {}); });
    }
    (function () {
      let deferred; const btn = document.getElementById('pwaInstallBtn');
      window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); deferred = e; if (btn) btn.style.display = 'inline-flex'; });
      if (btn) btn.addEventListener('click', async () => { if (!deferred) return; deferred.prompt(); const r = await deferred.userChoice; if (r.outcome === 'accepted') btn.style.display = 'none'; deferred = null; });
      window.addEventListener('appinstalled', () => { if (btn) btn.style.display = 'none'; deferred = null; });
    })();
  </script>
</body>
</html>
