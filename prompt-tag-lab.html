<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>프롬프트 태그와 교차검수 실습 노트</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#F3F6FA; --surface:#FFFFFF; --ink:#14213D; --muted:#56627A;
  --line:#D5DDE9; --blue:#1F5FA8; --blue-soft:#DDE9F6; --blue-ink:#123F75;
  --amber:#9A6B00; --amber-soft:#FFF3D1; --green:#1F7A4A; --green-soft:#DDF2E6;
  --term:#16223B; --term-ink:#E3EAF7; --term-dim:#8FA2C4;
  --sans:"IBM Plex Sans KR",-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --paper:#0E1524; --surface:#16203A; --ink:#E6ECF6; --muted:#9BA9C3;
    --line:#2A3858; --blue:#7FA6F0; --blue-soft:#1E2F55; --blue-ink:#B9CDF6;
    --amber:#F0C35A; --amber-soft:#3A2F12; --green:#6FD3A0; --green-soft:#153828;
    --term:#0A101D; --term-ink:#E3EAF7; --term-dim:#7F92B5;
  }
}
:root[data-theme="dark"]{
  --paper:#0E1524; --surface:#16203A; --ink:#E6ECF6; --muted:#9BA9C3;
  --line:#2A3858; --blue:#7FA6F0; --blue-soft:#1E2F55; --blue-ink:#B9CDF6;
  --amber:#F0C35A; --amber-soft:#3A2F12; --green:#6FD3A0; --green-soft:#153828;
  --term:#0A101D; --term-ink:#E3EAF7; --term-dim:#7F92B5;
}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:17px;line-height:1.75;-webkit-text-size-adjust:100%}
button{font-family:inherit;font-size:inherit;color:inherit}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px;border-radius:4px}

/* layout */
.app{display:grid;grid-template-columns:300px 1fr;min-height:100vh}
.rail{position:sticky;top:0;height:100vh;overflow-y:auto;border-right:1px solid var(--line);background:var(--surface);padding:24px 20px 40px}
.main{min-width:0;padding:32px clamp(18px,5vw,64px) 80px}
.page{max-width:720px}

/* rail */
.brand{font-weight:700;font-size:18px;line-height:1.35;margin:0 0 4px}
.brand-sub{color:var(--muted);font-size:13px;margin:0 0 18px}
.meter{height:6px;background:var(--blue-soft);border-radius:3px;overflow:hidden}
.meter i{display:block;height:100%;background:var(--blue);width:0;transition:width .4s}
.meter-label{font-size:13px;color:var(--muted);margin:6px 0 22px}
.route{list-style:none;margin:0;padding:0}
.session{margin:0 0 18px}
.session-name{font-size:13px;font-weight:700;color:var(--blue-ink);margin:0 0 6px;padding-left:2px}
.stops{list-style:none;margin:0;padding:0;position:relative}
.stops::before{content:"";position:absolute;left:9px;top:10px;bottom:10px;width:2px;background:var(--line)}
.stop button{display:flex;align-items:flex-start;gap:10px;width:100%;text-align:left;background:none;border:0;padding:5px 6px 5px 0;cursor:pointer;border-radius:6px;font-size:14.5px;line-height:1.45;color:var(--ink)}
.stop button:hover{background:var(--blue-soft)}
.dot{flex:none;width:20px;height:20px;border-radius:50%;border:2px solid var(--line);background:var(--surface);position:relative;z-index:1;margin-top:1px;display:grid;place-items:center;font-size:11px;color:#fff}
.stop.done .dot{background:var(--blue);border-color:var(--blue)}
.stop.done .dot::after{content:"✓";font-weight:700}
.stop.current button{font-weight:700}
.stop.current .dot{border-color:var(--blue);box-shadow:0 0 0 4px var(--blue-soft)}
.rail-tools{display:flex;gap:8px;margin-top:22px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:13px;cursor:pointer}
.chip:hover{border-color:var(--blue)}

/* mobile top */
.topbar{display:none}
@media (max-width:900px){
  .app{grid-template-columns:1fr}
  .rail{position:fixed;inset:0 auto 0 0;width:min(86vw,340px);height:100%;z-index:30;transform:translateX(-105%);transition:transform .25s;padding-top:calc(24px + env(safe-area-inset-top,0px));box-shadow:0 0 40px rgba(0,0,0,.25)}
  .rail.open{transform:none}
  .scrim{position:fixed;inset:0;background:rgba(10,16,30,.45);z-index:20;display:none}
  .scrim.show{display:block}
  .topbar{display:flex;align-items:center;gap:10px;position:sticky;top:env(safe-area-inset-top,0px);z-index:10;background:var(--surface);border-bottom:1px solid var(--line);padding:10px 16px}
  .topbar .t{flex:1;min-width:0;font-size:14px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .topbar .meter{width:64px}
  .main{padding:22px 18px 80px}
  body{font-size:16.5px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

/* lesson */
.crumb{font-size:14px;color:var(--blue-ink);font-weight:500;margin:0 0 6px}
h1{font-size:clamp(26px,5.2vw,36px);line-height:1.3;margin:0 0 14px;letter-spacing:-.01em}
h2{font-size:20px;line-height:1.4;margin:36px 0 10px}
h3{font-size:17px;margin:24px 0 6px}
p{margin:0 0 14px}
.goal{border-left:4px solid var(--blue);padding:4px 0 4px 16px;margin:0 0 26px;color:var(--ink)}
.goal b{display:block;font-size:13px;color:var(--blue-ink)}
ul.plain{margin:0 0 16px;padding-left:1.2em}
ul.plain li{margin:2px 0}

/* prompt block */
.prompt{background:var(--blue-soft);border-radius:14px 14px 14px 4px;padding:14px 16px 12px;margin:0 0 18px;position:relative}
.prompt .who{font-size:12.5px;font-weight:700;color:var(--blue-ink);margin-bottom:4px}
.prompt .txt{white-space:pre-wrap;margin:0}

/* terminal/code */
.code{background:var(--term);color:var(--term-ink);border-radius:10px;margin:0 0 18px;overflow:hidden}
.code-head{display:flex;justify-content:space-between;align-items:center;padding:7px 12px;border-bottom:1px solid rgba(255,255,255,.08);font-family:var(--mono);font-size:12.5px;color:var(--term-dim)}
.code pre{margin:0;padding:14px 16px;overflow-x:auto;font-family:var(--mono);font-size:13.5px;line-height:1.6;white-space:pre}
.copy{background:none;border:1px solid rgba(255,255,255,.18);color:var(--term-ink);border-radius:6px;padding:2px 10px;font-size:12px;cursor:pointer}
.prompt .copy{position:absolute;top:10px;right:10px;border-color:var(--line);color:var(--blue-ink);background:var(--surface)}
.copy.ok{border-color:var(--green);color:var(--green)}

/* flow */
.flow{list-style:none;margin:0 0 20px;padding:0;counter-reset:f}
.flow li{position:relative;padding:4px 0 4px 34px}
.flow li::before{counter-increment:f;content:counter(f);position:absolute;left:0;top:6px;width:22px;height:22px;border-radius:50%;background:var(--surface);border:2px solid var(--blue);color:var(--blue-ink);font-size:11.5px;font-weight:700;display:grid;place-items:center}
.flow li:not(:last-child)::after{content:"";position:absolute;left:10px;top:30px;bottom:-6px;width:2px;background:var(--blue-soft)}

/* callouts */
.call{border-radius:10px;padding:12px 16px;margin:0 0 18px;font-size:15.5px}
.call b.h{display:block;margin-bottom:2px}
.call.warn{background:var(--amber-soft);color:var(--ink)}
.call.warn b.h{color:var(--amber)}
.call.tip{background:var(--green-soft)}
.call.tip b.h{color:var(--green)}
.call.me{background:var(--surface);border:1px dashed var(--blue)}
.call.me b.h{color:var(--blue-ink)}

/* table */
.tbl{overflow-x:auto;margin:0 0 18px}
table{border-collapse:collapse;width:100%;font-size:15px;min-width:460px}
th,td{text-align:left;padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:13px;color:var(--muted);font-weight:700}
td:first-child{font-weight:700;white-space:nowrap}

/* checks */
.checks{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px 18px;margin:34px 0 20px}
.checks h2{margin:0 0 8px;font-size:17px}
.checks label{display:flex;gap:10px;align-items:flex-start;padding:6px 0;cursor:pointer}
.checks input{width:20px;height:20px;margin-top:4px;accent-color:var(--blue);flex:none}
.done-btn{margin-top:10px;width:100%;border:0;border-radius:10px;padding:12px;font-weight:700;background:var(--blue);color:#fff;cursor:pointer}
.done-btn[disabled]{background:var(--line);color:var(--muted);cursor:not-allowed}
.done-btn.is-done{background:var(--green-soft);color:var(--green)}

.pager{display:flex;gap:10px;margin-top:10px}
.pager button{flex:1;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:12px;cursor:pointer;text-align:left;font-size:14px;line-height:1.4}
.pager button:hover{border-color:var(--blue)}
.pager button[disabled]{visibility:hidden}
.pager small{display:block;color:var(--muted);font-size:12px}
.pager .nx{text-align:right}

/* home */
.hero-title{font-size:clamp(30px,6.4vw,46px);line-height:1.2;margin:4px 0 16px;letter-spacing:-.02em}
.hero-lead{font-size:18px;color:var(--muted);margin:0 0 26px;max-width:36em}
.sessions{display:grid;gap:12px;margin:10px 0 26px}
.sess-row{display:flex;gap:14px;align-items:center;padding:14px 16px;background:var(--surface);border:1px solid var(--line);border-radius:12px;cursor:pointer;text-align:left;width:100%}
.sess-row:hover{border-color:var(--blue)}
.sess-no{flex:none;width:44px;height:44px;border-radius:10px;background:var(--blue-soft);color:var(--blue-ink);font-weight:700;display:grid;place-items:center;font-size:15px}
.sess-row .nm{font-weight:700;display:block}
.sess-row .ds{color:var(--muted);font-size:14px;display:block}
.sess-row .pc{margin-left:auto;font-size:13px;color:var(--muted);white-space:nowrap}
.start{border:0;background:var(--blue);color:#fff;font-weight:700;border-radius:10px;padding:13px 20px;cursor:pointer}

/* quiz */
.q{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin:0 0 12px}
.q p{margin:0 0 10px;font-weight:500}
.q .ox{display:flex;gap:8px}
.q .ox button{flex:1;border:1px solid var(--line);background:var(--paper);border-radius:8px;padding:8px;cursor:pointer;font-weight:700}
.q .ans{display:none;margin-top:10px;font-size:15px}
.q.answered .ans{display:block}
.q .right{color:var(--green)} .q .wrong{color:var(--amber)}
</style>
<style>
/* 도구 */
.tool{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;margin:0 0 20px}
.tool h3{margin:0 0 4px;font-size:16px}
.tool .hint{font-size:14px;color:var(--muted);margin:0 0 12px}
.field{margin:0 0 12px}
.field label{display:block;font-size:14px;font-weight:700;margin-bottom:4px}
.field input,.field textarea,.out{width:100%;border:1px solid var(--line);border-radius:8px;padding:10px 12px;font-family:inherit;font-size:15px;line-height:1.6;background:var(--paper);color:var(--ink)}
.field textarea{min-height:70px;resize:vertical}
.out{min-height:180px;font-family:var(--mono);font-size:13.5px;white-space:pre-wrap}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 12px}
.tags label{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--line);border-radius:999px;padding:4px 10px;font-size:14px;cursor:pointer;background:var(--paper)}
.tags input{accent-color:var(--blue)}
.tags label:has(input:checked){border-color:var(--blue);background:var(--blue-soft);color:var(--blue-ink)}
.row{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 12px}
.btn{border:0;border-radius:8px;padding:9px 16px;font-weight:700;background:var(--blue);color:#fff;cursor:pointer}
.btn.sub{background:var(--blue-soft);color:var(--blue-ink)}
.bytes{font-size:28px;font-weight:700;margin:6px 0 2px}
.bytes.ok{color:var(--green)} .bytes.low,.bytes.high{color:var(--amber)}
.tagdef{border-top:1px solid var(--line);padding:14px 0}
.tagdef:first-of-type{border-top:0;padding-top:4px}
.tagname{font-family:var(--mono);font-weight:500;font-size:17px;color:var(--blue-ink)}
.tagdef pre{margin:6px 0 0;white-space:pre-wrap;font-family:inherit;font-size:15px;color:var(--ink)}
</style>
</head>
<body>
<div class="topbar">
  <button class="chip" id="menuBtn" aria-label="목차 열기">목차</button>
  <span class="t" id="topTitle">프롬프트 태그 실습 노트</span>
  <div class="meter"><i id="meterTop"></i></div>
</div>
<div class="scrim" id="scrim"></div>
<div class="app">
  <nav class="rail" id="rail" aria-label="실습 목차">
    <p class="brand">프롬프트 태그와<br>교차검수 실습 노트</p>
    <p class="brand-sub">ChatGPT·Gemini·Claude 함께 쓰기 · 2026.9 기준</p>
    <div class="meter"><i id="meterSide"></i></div>
    <p class="meter-label" id="meterLabel">0 / 0 완료</p>
    <div id="route"></div>
    <div class="rail-tools">
      <button class="chip" id="homeBtn">처음 화면</button>
      <button class="chip" id="toolsBtn">도구 모음</button>
      <button class="chip" id="themeBtn">화면 밝기</button>
      <button class="chip" id="resetBtn">진도 초기화</button>
    </div>
  </nav>
  <main class="main"><div class="page" id="page"></div></main>
</div>

<script>
/* ================= 태그 사전 ================= */
const CORE = [
 ["/easy","초등학생도 이해하게","초등학생도 이해할 수 있도록 설명한다.\n어려운 용어는 처음 나올 때 쉬운 말로 풀어준다.\n가능하면 일상 또는 학교생활 예시를 하나 넣는다."],
 ["/step","단계별로","처음 하는 사람도 따라 할 수 있도록 1단계, 2단계, 3단계 순서로 설명한다.\n한 단계에는 한 가지 행동만 넣는다."],
 ["/table","표로 정리","비교하거나 정리하기 좋은 내용은 표로 보여준다.\n열 제목은 짧고 분명하게 작성한다."],
 ["/fact","사실·출처·최신 여부 확인","확인 가능한 사실을 우선한다.\n최신 정보가 중요하면 기준 날짜를 밝히고, 검색·공식 자료 확인이 가능하면 확인하며, 불가능하면 '최신 확인 필요'라고 밝힌다.\n필요하면 확인된 사실 / 자료에 근거한 해석 / 불확실한 내용 / 추가 확인 필요로 구분한다.\n수치는 기준 연도·대상·단위·출처를 함께 확인한다."],
 ["/noinvent","자료에 없는 내용 만들지 않기","자료에 없는 사람·날짜·숫자·학생 활동·성과·감정·인용문·기능을 새로 만들지 않는다.\n정보가 부족하면 억지로 채우지 말고 무엇이 부족한지 표시한다."],
 ["/keepall","원자료 누락 금지","원자료의 내용을 임의로 줄이거나 빠뜨리지 않는다.\n제목·본문·표·주의사항·세부 항목·순서를 유지한다.\n읽을 수 없는 부분은 추측하지 않고 [확인 필요] 또는 [판독 불가]로 표시한다."],
 ["/plan","만들지 말고 계획만","아직 결과물을 만들거나 수정하지 않는다.\n먼저 목표, 현재 문제, 가능한 방법, 추천 구조, 작업 순서, 예상 위험, 테스트 방법을 제안한다.\n사용자가 제작을 요청한 뒤 실제 작업에 들어간다."],
 ["/review","문제점 중심 검수","잘된 부분은 길게 설명하지 않는다.\n오류·누락·중복·잘못된 표현·삭제할 부분·추가할 부분·실제 사용 문제를 찾는다.\nA. 반드시 수정 / B. 수정 권장 / C. 선택 개선으로 분류하고, 각 항목은 문제 / 이유 / 수정 방법으로 쓴다.\n보지 못한 파일이나 실행하지 못한 기능은 '확인하지 못함'으로 표시한다."],
 ["/cross","여러 의견 교차검증","여러 AI나 자료의 의견을 단순히 합치지 않는다.\n원자료·공식 자료와 맞는지, 현재 목적에 필요한지, 실행 가능한지, 부작용과 기존 기능 훼손이 없는지 판단한다.\nA. 그대로 채택 / B. 수정 후 채택 / C. 보류 / D. 제외로 분류한다.\n여러 AI가 같은 말을 해도 원자료보다 우선하지 않는다."],
 ["/preserve","기존 정상 내용 유지","기존에 정상인 내용·기능·디자인은 유지하고 필요한 부분만 최소 범위로 수정한다.\n수정 후 무엇이, 왜 바뀌었고 기존 기능에 영향이 있는지 알려준다."],
 ["/webcheck","웹도구 종합 검수","기능(로드·버튼·입력·저장·검색·삭제·초기화·새로고침), 예외(빈 입력·긴 입력·잘못된 값), 화면(PC·휴대폰·버튼 크기·가로 스크롤·겹침), 출력(인쇄·PDF), 기술(Console 오류·404·상대경로·GitHub Pages), 보안(학생 개인정보·API Key·Password·Token·localStorage 민감정보·공개 JS 인증정보), 접근성(키보드 조작·의미가 분명한 버튼)을 검수한다.\nA. 즉시 수정 / B. 수정 권장 / C. 선택 개선으로 나눈다.\n실제 브라우저 테스트와 코드상 예상 점검을 구분해 보고한다."],
 ["/clean","AI 작업 흔적 제거","다른 AI 답변의 작업 흔적을 제거한다.\n삭제: '○s 동안 처리함', '좋습니다', '아래처럼 정리했습니다', 작업 과정 설명, 불필요한 총평, 자동으로 붙은 Q1~Q3, 원문과 관계없는 머리말·맺음말.\n실제 본문 내용은 유지한다."]

function dictText(tags, long){
  const lines = ["앞으로 이 대화에서는 다음 태그를 아래 정의대로 이해하고 적용해줘.",""];
  tags.forEach(t => { if (long) { lines.push(t[0] + " : " + t[1]); t[2].split("\n").forEach(s => lines.push("  - " + s)); lines.push(""); } else lines.push(t[0] + " = " + t[1]); });
  return lines.join("\n").trim();
}

 goal:"프롬프트를 잘 쓴다는 것은 태그를 외우는 것이 아니라, 목표·자료·대상·우선순위·금지·검수를 분명히 하고 사람이 최종 결정하는 것입니다.",
 blocks:[
  {t:"code",f:"매일 쓰는 공식",c:"[목표]\n무엇을 해줘.\n\n[자료]\n이 자료를 기준으로 해줘.\n\n[대상]\n누가 사용할 거야.\n\n[우선순위]\n1.\n2.\n3.\n\n[형식]\n어떤 결과로 보여줄지.\n\n[금지]\n자료에 없는 내용 만들지 말기.\n기존 정상 내용 함부로 삭제하지 말기.\n\n[검수]\n사실·누락·오류·실제 사용 가능성을 다시 확인해줘."},
  {t:"flow",items:["/plan","여러 AI","/clean","/cross","최종 설계","제작","/review","검수 의견 재검증","/preserve로 수정","재검수","사람 최종 승인"]}
 ],
 checks:["1차~6차 실습을 모두 마쳤다"]}
];

/* ================= 상태 ================= */
const KEY="prompt-lab-v1";
let state={done:{},checks:{},quiz:{},cur:null,tool:{}};
try{const s=localStorage.getItem(KEY);if(s)state=Object.assign(state,JSON.parse(s));}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify(state));}catch(e){}}
const $=s=>document.querySelector(s);
const el=(t,c,h)=>{const n=document.createElement(t);if(c)n.className=c;if(h!=null)n.innerHTML=h;return n;};

async function copyText(text,b){
  let ok=false;
  try{await navigator.clipboard.writeText(text);ok=true;}catch(e){
    const ta=document.createElement("textarea");ta.value=text;document.body.appendChild(ta);ta.select();
    try{ok=document.execCommand("copy");}catch(_){}ta.remove();}
  const o=b.textContent;b.textContent=ok?"복사됨":"직접 선택하세요";b.classList.toggle("ok",ok);
  setTimeout(()=>{b.textContent=o;b.classList.remove("ok");},1600);
}
function copyBtn(text,cls){const b=el("button","copy"+(cls?" "+cls:""),"복사");b.addEventListener("click",()=>copyText(typeof text==="function"?text():text,b));return b;}

/* ================= 도구 ================= */
function toolBuilder(){
  const d=el("div","tool");
  d.appendChild(el("h3","","프롬프트 조립기 (8칸)"));
  d.appendChild(el("p","hint","칸을 채우고 태그를 고르면 바로 붙여넣을 프롬프트가 만들어집니다. 빈 칸은 빠집니다."));
  const F=[["goal","목표","예: 2학기 진로 설명회 안내문 작성"],["who","대상","예: 고1 학부모"],["ctx","자료·상황","예: 첨부 공문 기준, 네이버 밴드에 올림"],["pri","우선순위","예: 1. 정확성 2. 쉬운 설명 3. 간결함"],["fmt","결과 형식","예: 제목 1개 + 안내 7줄 + FAQ 3개"],["no","금지 사항","예: 공문에 없는 내용 추가 금지"],["fact","사실 확인","예: 날짜·장소를 원문과 대조"],["chk","최종 검수","예: 누락·모순·중복 다시 확인"]];
  const v=state.tool.b||{};
  F.forEach(([k,lab,ph])=>{const f=el("div","field");f.appendChild(el("label","",lab));const ta=el("textarea");ta.placeholder=ph;ta.value=v[k]||"";ta.dataset.k=k;ta.rows=2;f.appendChild(ta);d.appendChild(f);});
  d.appendChild(el("label","","태그 선택")).style.cssText="display:block;font-size:14px;font-weight:700;margin-bottom:4px";
  const tg=el("div","tags");
  ALLTAGS.forEach(t=>{const l=el("label");const c=el("input");c.type="checkbox";c.value=t[0];c.checked=(v.tags||[]).includes(t[0]);l.appendChild(c);l.appendChild(document.createTextNode(t[0]));tg.appendChild(l);});
  d.appendChild(tg);
  const out=el("textarea","out");out.readOnly=true;
  const build=()=>{
    const o={};d.querySelectorAll("textarea[data-k]").forEach(t=>o[t.dataset.k]=t.value.trim());
    o.tags=[...tg.querySelectorAll("input:checked")].map(c=>c.value);
    state.tool.b=o;save();
    const parts=[];F.forEach(([k,lab])=>{if(o[k])parts.push("["+lab+"]\n"+o[k]);});
    if(o.tags.length)parts.push(o.tags.join("\n"));
    out.value=parts.join("\n\n")||"칸을 채우면 여기에 프롬프트가 만들어집니다.";
  };
  d.addEventListener("input",build);build();
  d.appendChild(out);
  const r=el("div","row");const cb=el("button","btn","프롬프트 복사");cb.addEventListener("click",()=>copyText(out.value,cb));
  const clr=el("button","btn sub","모두 지우기");clr.addEventListener("click",()=>{d.querySelectorAll("textarea[data-k]").forEach(t=>t.value="");tg.querySelectorAll("input").forEach(c=>c.checked=false);build();});
  r.appendChild(cb);r.appendChild(clr);d.appendChild(r);
  d.appendChild(el("p","hint","태그 뜻을 AI가 모르면 효과가 없습니다. 사전을 먼저 등록하거나 ‘태그 사전 만들기’ 결과를 맨 위에 함께 붙이세요."));
  return d;
}
function toolDict(){
  const d=el("div","tool");
  d.appendChild(el("h3","","태그 사전 만들기"));
  d.appendChild(el("p","hint","넣을 태그를 고르고 길이를 정하면, ChatGPT·Gemini·Claude에 붙여넣을 사전이 만들어집니다."));
  const tg=el("div","tags");const sel=state.tool.d||CORE.map(t=>t[0]);
  ALLTAGS.forEach(t=>{const l=el("label");const c=el("input");c.type="checkbox";c.value=t[0];c.checked=sel.includes(t[0]);l.appendChild(c);l.appendChild(document.createTextNode(t[0]));tg.appendChild(l);});
  d.appendChild(tg);
  const r0=el("div","row");const sh=el("button","btn sub","짧은 정의 (맞춤 지침용)");const lg=el("button","btn sub","자세한 정의 (교차검수용)");r0.appendChild(sh);r0.appendChild(lg);d.appendChild(r0);
  const out=el("textarea","out");out.readOnly=true;let long=!!state.tool.dl;
  const build=()=>{const s=[...tg.querySelectorAll("input:checked")].map(c=>c.value);state.tool.d=s;state.tool.dl=long;save();
    sh.className="btn"+(long?" sub":"");lg.className="btn"+(long?"":" sub");
    out.value=dictText(ALLTAGS.filter(t=>s.includes(t[0])),long);};
  tg.addEventListener("change",build);sh.addEventListener("click",()=>{long=false;build();});lg.addEventListener("click",()=>{long=true;build();});build();
  d.appendChild(out);
  const r=el("div","row");const cb=el("button","btn","사전 복사");cb.addEventListener("click",()=>copyText(out.value,cb));r.appendChild(cb);d.appendChild(r);
  return d;
}
function toolClean(){
  const d=el("div","tool");
  d.appendChild(el("h3","","/clean 도구"));
  d.appendChild(el("p","hint","다른 AI 답변을 붙여넣고 지울 항목을 고릅니다. 문단은 빈 줄로 구분합니다. 결과는 꼭 눈으로 확인하세요."));
  const inF=el("div","field");inF.appendChild(el("label","","붙여넣을 답변"));const inp=el("textarea");inp.rows=6;inp.placeholder="예: 29s 동안 처리함\n\n좋습니다. 아래처럼 정리했습니다.\n\n(본문)\n\nQ1. …";inF.appendChild(inp);d.appendChild(inF);
  const opts=[["time","처리 시간 표시 줄",true],["q","Q1~Q3 질문 줄",true],["first","첫 문단 (머리말)",false],["last","마지막 문단 (맺음말)",false]];
  const tg=el("div","tags");opts.forEach(([k,lab,on])=>{const l=el("label");const c=el("input");c.type="checkbox";c.dataset.k=k;c.checked=on;l.appendChild(c);l.appendChild(document.createTextNode(lab));tg.appendChild(l);});d.appendChild(tg);
  const out=el("textarea","out");out.readOnly=true;const info=el("p","hint","");
  const run=()=>{
    const o={};tg.querySelectorAll("input").forEach(c=>o[c.dataset.k]=c.checked);
    let lines=inp.value.replace(/\r/g,"").split("\n");let rm=0;
    if(o.time)lines=lines.filter(x=>{const hit=/^\s*\d+(\.\d+)?\s*(s|초|분)\s*동안\s*(처리|생각)/.test(x);if(hit)rm++;return !hit;});
    if(o.q)lines=lines.filter(x=>{const hit=/^\s*[*#\s]*Q\s?[1-3]\s*[.:)]/i.test(x);if(hit)rm++;return !hit;});
    let paras=lines.join("\n").split(/\n\s*\n/).map(p=>p.trim()).filter(Boolean);
    if(o.first&&paras.length>1){paras.shift();rm++;}
    if(o.last&&paras.length>1){paras.pop();rm++;}
    out.value=paras.join("\n\n");
    info.textContent=inp.value.trim()?("정리한 항목 "+rm+"개. 본문이 잘리지 않았는지 확인하세요."):"";
  };
  d.addEventListener("input",run);d.addEventListener("change",run);
  d.appendChild(out);d.appendChild(info);
  const r=el("div","row");const cb=el("button","btn","정리본 복사");cb.addEventListener("click",()=>copyText(out.value,cb));r.appendChild(cb);d.appendChild(r);
  return d;
}
function toolBytes(){
  const d=el("div","tool");
  d.appendChild(el("h3","","세특 바이트 계산기"));
  d.appendChild(el("p","hint","한글 3바이트, 영문·숫자·공백·기호 1바이트, 줄바꿈 2바이트로 계산합니다(나이스 방식 기준). 최종 분량은 나이스 입력 화면에서 한 번 더 확인하세요."));
  const f=el("div","field");const ta=el("textarea");ta.rows=7;ta.placeholder="세특 초안을 붙여넣으세요";ta.value=state.tool.t||"";f.appendChild(ta);d.appendChild(f);
  const big=el("p","bytes","0바이트");const sub=el("p","hint","");
  const calc=()=>{let b=0,ch=0;for(const c of ta.value.replace(/\r/g,"")){ch++;if(c==="\n")b+=2;else if(c.charCodeAt(0)>127)b+=3;else b+=1;}
    state.tool.t=ta.value;save();
    big.textContent=b.toLocaleString()+"바이트";
    big.className="bytes"+(b===0?"":b<1300?" low":b>1500?" high":" ok");
    sub.textContent=b===0?"목표 1300~1500바이트":b<1300?("목표까지 "+(1300-b)+"바이트 부족 · "+ch+"자"):b>1500?("목표보다 "+(b-1500)+"바이트 초과 · "+ch+"자"):("목표 범위 안 · "+ch+"자");};
  ta.addEventListener("input",calc);calc();
  d.appendChild(big);d.appendChild(sub);
  return d;
}
function toolTagRef(){
  const d=el("div","tool");d.appendChild(el("h3","","핵심 태그 12개 정의"));
  d.appendChild(el("p","hint","각 정의는 복사해서 사전에 그대로 쓸 수 있습니다."));
  CORE.forEach(t=>{const w=el("div","tagdef");const top=el("div","row");top.style.cssText="justify-content:space-between;align-items:center;margin:0";
    top.appendChild(el("span","tagname",t[0]+" <span style='font-family:var(--sans);font-size:14px;color:var(--muted)'>"+t[1]+"</span>"));
    const b=copyBtn(t[0]+" : "+t[2]);b.style.cssText="border-color:var(--line);color:var(--blue-ink);background:var(--paper)";top.appendChild(b);
    w.appendChild(top);const pre=el("pre");pre.textContent=t[2];w.appendChild(pre);d.appendChild(w);});
  return d;
}
const TOOLS={builder:toolBuilder,dict:toolDict,clean:toolClean,bytes:toolBytes,tagref:toolTagRef};

/* ================= 렌더 ================= */
function renderRoute(){
  const r=$("#route");r.innerHTML="";
  SESSIONS.forEach((s,si)=>{const box=el("div","session");box.appendChild(el("p","session-name",s.no+" · "+s.name));
    const ul=el("ul","stops");
    L.filter(l=>l.s===si).forEach(l=>{const li=el("li","stop"+(state.done[l.id]?" done":"")+(state.cur===l.id?" current":""));
      const b=el("button");b.appendChild(el("span","dot"));b.appendChild(el("span","",l.no+" "+l.title));
      b.addEventListener("click",()=>{go(l.id);closeRail();});li.appendChild(b);ul.appendChild(li);});
    box.appendChild(ul);r.appendChild(box);});
  const n=L.filter(l=>state.done[l.id]).length,p=Math.round(n/L.length*100);
  $("#meterSide").style.width=p+"%";$("#meterTop").style.width=p+"%";
  $("#meterLabel").textContent=n+" / "+L.length+" 완료 ("+p+"%)";
}
function renderHome(){
  state.cur=null;save();renderRoute();$("#topTitle").textContent="프롬프트 태그 실습 노트";
  const p=$("#page");p.innerHTML="";
  p.appendChild(el("h1","hero-title","태그 12개와 교차검수로<br>AI 일을 반복 가능하게"));
  p.appendChild(el("p","hero-lead","프롬프트 기초부터 태그 사전 등록, 여러 AI 교차검수, 웹도구 배포, 세특까지. 실제 업무 자료로 따라 하는 22개 실습과 바로 쓰는 도구 4가지가 들어 있습니다."));
  const next=L.find(l=>!state.done[l.id])||L[0];
  const st=el("button","start",L.some(l=>state.done[l.id])?"이어서 하기: "+next.no+" "+next.title:"첫 실습 시작하기");
  st.addEventListener("click",()=>go(next.id));p.appendChild(st);
  p.appendChild(el("h2","","차시별로 보기"));
  const box=el("div","sessions");
  SESSIONS.forEach((s,si)=>{const ls=L.filter(l=>l.s===si),dn=ls.filter(l=>state.done[l.id]).length;
    const b=el("button","sess-row");
    b.innerHTML='<span class="sess-no">'+s.no+'</span><span><span class="nm">'+s.name+'</span><span class="ds">'+s.desc+'</span></span><span class="pc">'+dn+"/"+ls.length+"</span>";
    b.addEventListener("click",()=>go(ls[0].id));box.appendChild(b);});
  p.appendChild(box);window.scrollTo(0,0);
}
function renderBlock(b){
  switch(b.t){
    case "p":return el("p","",b.h);
    case "h":return el("h2","",b.h);
    case "prompt":{const d=el("div","prompt");d.appendChild(el("div","who","AI에게 입력"));const t=el("p","txt");t.textContent=b.c;d.appendChild(t);d.appendChild(copyBtn(b.c));return d;}
    case "code":{const d=el("div","code");const h=el("div","code-head");h.appendChild(el("span","",b.f));h.appendChild(copyBtn(b.c));d.appendChild(h);const pre=el("pre");pre.textContent=b.c;d.appendChild(pre);return d;}
    case "flow":{const o=el("ol","flow");b.items.forEach(i=>o.appendChild(el("li","",i)));return o;}
    case "list":{const u=el("ul","plain");b.items.forEach(i=>u.appendChild(el("li","",i)));return u;}
    case "warn":case "tip":case "call":case "me":{const d=el("div",b.t==="call"?"call":"call "+b.t);d.appendChild(el("b","h",b.h));d.appendChild(el("span","",b.b));return d;}
    case "table":{const w=el("div","tbl"),t=el("table"),th=el("tr");b.head.forEach(h=>th.appendChild(el("th","",h)));const hd=el("thead");hd.appendChild(th);t.appendChild(hd);
      const tb=el("tbody");b.rows.forEach(r=>{const tr=el("tr");r.forEach(c=>tr.appendChild(el("td","",c)));tb.appendChild(tr);});t.appendChild(tb);w.appendChild(t);return w;}
    case "tool":return TOOLS[b.name]();
  }
  return el("div");
}
function renderQuiz(l,p){
  l.quiz.forEach((q,i)=>{const key=l.id+i,d=el("div","q");d.appendChild(el("p","",(i+1)+". "+q[0]));
    const ox=el("div","ox"),ans=el("div","ans");
    const show=pick=>{const right=pick===q[1];ans.innerHTML='<b class="'+(right?"right":"wrong")+'">'+(right?"정답":"다시 보기")+"</b> · 답은 "+(q[1]?"O":"X")+". "+q[2];d.classList.add("answered");};
    ["O","X"].forEach(v=>{const bt=el("button","",v);bt.addEventListener("click",()=>{state.quiz[key]=v==="O";save();show(v==="O");});ox.appendChild(bt);});
    d.appendChild(ox);d.appendChild(ans);if(key in state.quiz)show(state.quiz[key]);p.appendChild(d);});
}
function go(id){
  const idx=L.findIndex(l=>l.id===id);if(idx<0)return renderHome();
  const l=L[idx];state.cur=id;save();renderRoute();$("#topTitle").textContent=l.no+" "+l.title;
  const p=$("#page");p.innerHTML="";
  p.appendChild(el("p","crumb",SESSIONS[l.s].no+" "+SESSIONS[l.s].name+" / "+l.no));
  p.appendChild(el("h1","",l.title));
  const g=el("div","goal");g.appendChild(el("b","","이번 목표"));g.appendChild(el("span","",l.goal));p.appendChild(g);
  l.blocks.forEach(b=>p.appendChild(renderBlock(b)));
  if(l.quiz)renderQuiz(l,p);
  const ck=el("section","checks");ck.appendChild(el("h2","","성공 확인"));
  const saved=state.checks[id]||[];const btn=el("button","done-btn");
  const refresh=()=>{const all=(state.checks[id]||[]).filter(Boolean).length===l.checks.length;
    if(state.done[id]){btn.textContent="완료함 · 다시 풀려면 누르기";btn.className="done-btn is-done";btn.disabled=false;}
    else{btn.textContent=all?"이 실습 완료":"확인 항목을 모두 체크하세요";btn.className="done-btn";btn.disabled=!all;}};
  l.checks.forEach((c,i)=>{const lab=el("label"),cb=el("input");cb.type="checkbox";cb.checked=!!saved[i];
    cb.addEventListener("change",()=>{const a=state.checks[id]||[];a[i]=cb.checked;state.checks[id]=a;if(!cb.checked)delete state.done[id];save();refresh();renderRoute();});
    lab.appendChild(cb);lab.appendChild(el("span","",c));ck.appendChild(lab);});
  btn.addEventListener("click",()=>{if(state.done[id])delete state.done[id];else state.done[id]=true;save();refresh();renderRoute();
    if(state.done[id]&&L[idx+1])setTimeout(()=>go(L[idx+1].id),350);});
  refresh();ck.appendChild(btn);p.appendChild(ck);
  const pg=el("div","pager"),prev=L[idx-1],next=L[idx+1];
  const pb=el("button","",prev?"<small>이전</small>"+prev.no+" "+prev.title:"");pb.disabled=!prev;if(prev)pb.addEventListener("click",()=>go(prev.id));
  const nb=el("button","nx",next?"<small>다음</small>"+next.no+" "+next.title:"");nb.disabled=!next;if(next)nb.addEventListener("click",()=>go(next.id));
  pg.appendChild(pb);pg.appendChild(nb);p.appendChild(pg);window.scrollTo(0,0);
}

const rail=$("#rail"),scrim=$("#scrim");
function closeRail(){rail.classList.remove("open");scrim.classList.remove("show");}
$("#menuBtn").addEventListener("click",()=>{rail.classList.add("open");scrim.classList.add("show");});
scrim.addEventListener("click",closeRail);
$("#homeBtn").addEventListener("click",()=>{renderHome();closeRail();});
$("#toolsBtn").addEventListener("click",()=>{go("tools");closeRail();});
$("#resetBtn").addEventListener("click",()=>{if(confirm("체크한 진도, 퀴즈, 도구 입력 내용을 모두 지울까요?")){state={done:{},checks:{},quiz:{},cur:null,tool:{}};save();renderHome();closeRail();}});
$("#themeBtn").addEventListener("click",()=>{const r=document.documentElement;const dark=r.dataset.theme?r.dataset.theme==="dark":matchMedia("(prefers-color-scheme: dark)").matches;r.dataset.theme=dark?"light":"dark";try{localStorage.setItem(KEY+"-theme",r.dataset.theme);}catch(e){}});
try{const t=localStorage.getItem(KEY+"-theme");if(t)document.documentElement.dataset.theme=t;}catch(e){}
state.cur?go(state.cur):renderHome();
</script>
