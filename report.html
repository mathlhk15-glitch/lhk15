<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>통합 상담 리포트 | 창원경일고 진로진학 워크스테이션</title>
  <meta name="description" content="검사결과, 생기부 분석, 상담기록을 모아 출력하는 창원경일고 진로진학 통합 상담 리포트" />
  <link rel="stylesheet" href="common.css" />
  <style>
    body[data-ws-page="report"] { background: var(--bg); }
    .report-shell { max-width: 1120px; margin: 0 auto; padding: 24px 20px 56px; }
    .report-hero {
      background: linear-gradient(135deg, var(--primary), var(--primary-light));
      color: #fff;
      border-radius: var(--radius-md);
      padding: 22px 24px;
      margin-bottom: 16px;
      display: flex;
      gap: 16px;
      justify-content: space-between;
      align-items: flex-start;
      flex-wrap: wrap;
    }
    .report-kicker { font-size: 12px; color: rgba(255,255,255,.7); margin-bottom: 4px; }
    .report-title { font-size: 22px; font-weight: 800; line-height: 1.35; }
    .report-sub { font-size: 13px; color: rgba(255,255,255,.75); margin-top: 6px; }
    .report-actions { display: flex; gap: 8px; flex-wrap: wrap; justify-content: flex-end; }
    .report-actions .ws-btn { height: 36px; }
    .report-panel {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      padding: 16px;
      margin-bottom: 16px;
      box-shadow: var(--shadow-sm);
    }
    .report-filter {
      display: grid;
      grid-template-columns: 1fr auto auto;
      gap: 8px;
      align-items: center;
    }
    .report-filter input { min-width: 0; }
    .report-meta {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
      margin-top: 12px;
    }
    .meta-box {
      background: var(--bg-hover);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 10px 12px;
    }
    .meta-label { font-size: 11px; color: var(--text-muted); margin-bottom: 3px; }
    .meta-value { font-size: 14px; font-weight: 800; color: var(--primary); word-break: keep-all; }
    .report-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 14px; }
    .report-section {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      padding: 16px 18px;
      box-shadow: var(--shadow-sm);
      min-height: 148px;
      break-inside: avoid;
    }
    .report-section--wide { grid-column: 1 / -1; }
    .section-head {
      display: flex;
      align-items: center;
      gap: 8px;
      padding-bottom: 8px;
      margin-bottom: 10px;
      border-bottom: 2px solid var(--accent-light);
      color: var(--primary);
      font-size: 14px;
      font-weight: 800;
    }
    .section-num {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 22px;
      height: 22px;
      border-radius: 50%;
      background: var(--primary);
      color: #fff;
      font-size: 11px;
      flex-shrink: 0;
    }
    .report-list { display: flex; flex-direction: column; gap: 7px; font-size: 13px; color: var(--text-sub); }
    .report-list li { margin-left: 18px; line-height: 1.65; }
    .empty-note { color: var(--text-muted); font-size: 13px; line-height: 1.7; }
    .tag-row { display: flex; gap: 6px; flex-wrap: wrap; }
    .report-tag {
      display: inline-flex;
      padding: 3px 9px;
      border-radius: 999px;
      background: var(--accent-light);
      color: var(--accent);
      font-size: 11px;
      font-weight: 800;
    }
    .report-text { font-size: 13px; color: var(--text-sub); line-height: 1.75; white-space: pre-wrap; }
    .prompt-box {
      width: 100%;
      min-height: 180px;
      resize: vertical;
      margin-top: 10px;
      font-family: var(--font-mono);
      font-size: 12px;
      line-height: 1.6;
    }
    .source-badges { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 12px; }
    .source-badge {
      font-size: 11px;
      font-weight: 800;
      padding: 3px 9px;
      border-radius: 999px;
      background: #f1f5f9;
      color: var(--text-muted);
      border: 1px solid var(--border);
    }
    .source-badge.ok { background: #dcfce7; color: #166534; border-color: #bbf7d0; }
    @media (max-width: 820px) {
      .report-filter { grid-template-columns: 1fr; }
      .report-meta { grid-template-columns: repeat(2, 1fr); }
      .report-grid { grid-template-columns: 1fr; }
      .report-title { font-size: 18px; }
    }
    @media print {
      .ws-nav, .ws-nav__mobile-menu, .ws-footer, .report-actions, .report-filter, .prompt-panel { display: none !important; }
      body { background: #fff !important; padding-top: 0 !important; }
      .report-shell { max-width: 100%; padding: 0; }
      .report-hero { color: #111; background: #fff; border: 1px solid #ddd; padding: 14px 0; margin-bottom: 10px; }
      .report-section, .report-panel { box-shadow: none; border-color: #ddd; }
      .report-grid { gap: 10px; }
    }
  </style>
</head>
<body data-ws-page="report">
  <main class="report-shell">
    <section class="report-hero">
      <div>
        <div class="report-kicker">창원경일고 진로진학상담부</div>
        <h1 class="report-title">통합 상담 리포트</h1>
        <p class="report-sub">학생 기본정보, 진로검사, 생기부 분석, 상담기록을 한 장의 상담 자료로 모읍니다.</p>
      </div>
      <div class="report-actions">
        <button class="ws-btn ws-btn--secondary" type="button" onclick="ReportPage.copyPrompt()">🤖 AI 프롬프트 복사</button>
        <button class="ws-btn ws-btn--secondary" type="button" onclick="ReportPage.exportJson()">⬇ JSON</button>
        <button class="ws-btn ws-btn--primary" type="button" onclick="window.print()">🖨️ 인쇄/PDF</button>
      </div>
    </section>

    <section class="report-panel">
      <div class="report-filter">
        <input class="ws-input" id="studentLookup" placeholder="학번 또는 이름 입력" autocomplete="off" />
        <button class="ws-btn ws-btn--secondary" type="button" onclick="ReportPage.loadFromInput()">조회</button>
        <button class="ws-btn ws-btn--gold" type="button" onclick="ReportPage.importJson()">JSON 불러오기</button>
      </div>
      <div class="source-badges" id="sourceBadges"></div>
      <div class="report-meta" id="reportMeta"></div>
    </section>

    <section class="report-grid" id="reportGrid"></section>

    <section class="report-panel prompt-panel">
      <div class="section-head"><span class="section-num">AI</span>AI 요약 생성용 프롬프트</div>
      <p class="empty-note">아래 프롬프트를 Claude 또는 ChatGPT에 붙여넣으면 학부모 상담용 문장과 다음 상담 과제를 더 자연스럽게 다듬을 수 있습니다.</p>
      <textarea class="ws-input prompt-box" id="aiPrompt" readonly></textarea>
    </section>
  </main>

  <input id="jsonImportInput" type="file" accept="application/json" style="display:none" />
  <script src="nav.js"></script>
  <script src="report.js"></script>
</body>
</html>
